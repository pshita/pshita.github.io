  <main class="wrap" style="padding-top: 34px; max-width: 480px;">
    <div class="breadcrumbs"><a href="./">בית</a> ← התחברות</div>
    <h1 class="lesson-title">התחברות</h1>

    <form id="login-form" class="auth-form">
      <label>
        מי נכנס?
        <select name="email" id="login-user" required disabled>
          <option value="">טוען את הרשימה…</option>
        </select>
      </label>
      <label>
        סיסמה
        <input type="password" name="password" id="login-password" autocomplete="current-password" required />
      </label>

      <p class="auth-error" id="form-error" hidden></p>

      <button type="submit" class="auth-submit">התחברות</button>
    </form>

    <p style="margin-top: 16px; font-size: .9rem; color: var(--ink-soft);">
      עדיין לא נרשמת? <a href="register">הרשמה</a>
    </p>
  </main>

  <footer class="site-footer"></footer>

  <script src="assets/js/main.js?v=3"></script>
  <script type="module" src="assets/js/header-auth.js?v=11"></script>
  <script type="module" src="assets/js/score.js"></script>
  <script type="module">
    import { loginWithEmail, isReady, getApp } from "./assets/js/auth.js";

    const form = document.getElementById("login-form");
    const select = document.getElementById("login-user");
    const errorEl = document.getElementById("form-error");
    const LAST_KEY = "pshita.login.last";  // the name picked last time on this device
    const showError = (text) => { errorEl.textContent = text; errorEl.hidden = !text; };

    // Everyone registered, by name (from the server; the admin shows as "ניהול").
    async function loadUsers() {
      if (!isReady()) { showError("ההתחברות עדיין לא מוגדרת באתר. נסו שוב מאוחר יותר."); return; }
      try {
        const f = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js");
        const res = await f.httpsCallable(f.getFunctions(getApp()), "listUsers")();
        const users = res.data.users || [];
        const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
        select.innerHTML = '<option value="">בחרו את השם שלכם</option>' +
          users.map((u) => `<option value="${esc(u.email)}">${esc(u.name)}</option>`).join("");
        let last = "";
        try { last = localStorage.getItem(LAST_KEY) || ""; } catch (e) {}
        if (users.some((u) => u.email === last)) select.value = last;
        select.disabled = false;
        if (select.value) document.getElementById("login-password").focus();
      } catch (err) {
        select.innerHTML = '<option value="">הרשימה לא נטענה</option>';
        showError("לא הצלחתי לטעון את רשימת המשתמשים. נסו לרענן את הדף.");
      }
    }
    loadUsers();
    select.addEventListener("change", () => { if (select.value) document.getElementById("login-password").focus(); });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      showError("");
      const data = Object.fromEntries(new FormData(form).entries());
      if (!data.email) { showError("בחרו את השם שלכם ברשימה."); return; }
      const submitBtn = form.querySelector(".auth-submit");
      submitBtn.disabled = true;
      try {
        await loginWithEmail(data.email, data.password);
        try { localStorage.setItem(LAST_KEY, data.email); } catch (e) {}
        window.location.href = "./";
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
      }
    });
  </script>
