<body>
  <header class="site-header">

        <button type="button" class="brand dropdown-trigger">

        <div class="dropdown-menu brand-menu" hidden>
          <div class="submenu">
            <button type="button" class="dropdown-item submenu-trigger">
              <span>דף ב, עמוד א</span>
              <svg class="submenu-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="dropdown-menu submenu-panel" hidden>
            <a class="dropdown-item" href="lessons/avot-vetoldot">״אבות נזיקין״</a>
            <a class="dropdown-item" href="lessons/shor-umave">״השור, הבור, המבעה וההבער״</a>
            <a class="dropdown-item" href="lessons/lo-hari-hashor">״לא הרי השור כהרי המבעה״</a>
            <a class="dropdown-item" href="lessons/gabei-shabbat-tanan">״גבי שבת תנן״</a>
            <a class="dropdown-item" href="lessons/umai-ika">״ומאי איכא בין אב לתולדה״</a>
            <a class="dropdown-item" href="lessons/gabei-tumaot-tanan">״גבי טומאות תנן״</a>
            </div>
          </div>
          <div class="submenu">
            <button type="button" class="dropdown-item submenu-trigger">
              <span>דף ב, עמוד ב</span>
              <svg class="submenu-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="dropdown-menu submenu-panel" hidden>
            <a class="dropdown-item" href="lessons/shlosha-avot-beshor">״ת"ר: ג' אבות נאמרו בשור״</a>
            <a class="dropdown-item" href="lessons/keren-manlan">״קרן מנלן״</a>
            <a class="dropdown-item" href="lessons/toldah-dekeren">״תולדה דקרן״</a>
            <a class="dropdown-item" href="lessons/mai-shena-negicha">״מאי שנא נגיחה״</a>
            <a class="dropdown-item" href="lessons/mai-shena-gabei-adam">״מאי שנא גבי אדם״</a>

            </div>
          </div>
          <div class="auth-area" id="auth-area-out">
            <a class="auth-link auth-link-primary" href="login">התחברות</a>
          </div>
          <div class="auth-area" id="auth-area-in" hidden>
            <a class="score-badge" id="score-badge" href="achievements" hidden></a>
            <div class="auth-hello"><span class="auth-user-name" id="auth-user-name"></span><button type="button" class="auth-logout" id="logout-btn">יציאה</button></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap" style="padding-top: 34px; max-width: 480px;">
    <div class="breadcrumbs"><a href="./">בית</a> ← התחברות</div>
    <h1 class="lesson-title">התחברות</h1>

    <form id="login-form" class="auth-form">
      <label>
        שם פרטי
        <input type="text" name="firstName" required />
      </label>
      <label>
        שם משפחה
        <input type="text" name="lastName" required />
      </label>
      <label>
        קוד אישי (4 ספרות)
        <input type="password" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required />
      </label>

      <p class="auth-error" id="form-error" hidden></p>

      <button type="submit" class="auth-submit">התחברות</button>
    </form>

    <p style="margin-top: 16px; font-size: .9rem; color: var(--ink-soft);">
      עדיין לא נרשמת? <a href="register">הרשמה</a>
    </p>
  </main>

  <footer class="site-footer"></footer>

  <script src="assets/js/main.js?v=3"></script>
  <script type="module" src="assets/js/header-auth.js?v=7"></script>
  <script type="module" src="assets/js/score.js"></script>
  <script type="module">
    import { loginUser, isReady } from "./assets/js/auth.js";

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("form-error");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.hidden = true;

      if (!isReady()) {
        errorEl.textContent = "ההתחברות עדיין לא מוגדרת באתר. נסו שוב מאוחר יותר.";
        errorEl.hidden = false;
        return;
      }

      const data = Object.fromEntries(new FormData(form).entries());
      const submitBtn = form.querySelector(".auth-submit");
      submitBtn.disabled = true;
      try {
        await loginUser(data);
        window.location.href = "./";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
