<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טקסט רציף | פשיטא</title>
<style>
/* plain continuous text of the lessons, like a word-processor page */
:root{--ink:#111;--muted:#666;--line:#ddd;--desk:#e9e9ec;--page:#fff;--accent:#1a5fb4;--edit:#fff8d6}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:Arial,'Segoe UI',sans-serif}
.bar{position:sticky;top:0;z-index:3;background:#f7f7f8;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px}
.bar a{color:var(--accent)}
.bar button{font:inherit;padding:6px 12px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
.bar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar button:disabled{opacity:.5;cursor:default}
.bar label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
#msg{font-weight:700}
#msg.err{color:#b00020}
.pick{max-width:820px;margin:16px auto 0;padding:0 16px}
.pick details{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.pick summary{cursor:pointer;font-weight:700}
.pick .grp{margin-top:10px}
.pick .grp>label{font-weight:700}
.pick .ls{display:flex;flex-wrap:wrap;gap:4px 16px;padding:6px 22px 0}
.page{max-width:820px;margin:16px auto 40px;background:var(--page);box-shadow:0 1px 4px rgba(0,0,0,.15);padding:56px 64px;font-family:'David','Times New Roman',serif;font-size:18px;line-height:1.7}
.page h1{font-size:26px;margin:0 0 4px}
.page h1:not(:first-child){margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
.page .ref{color:var(--muted);font-size:15px;margin:0 0 16px}
.page h2{font-size:20px;margin:24px 0 6px}
.page p{margin:0 0 10px}
.page .q{margin:12px 0 4px;font-weight:700}
.page ol{list-style-type:hebrew;margin:0 0 10px;padding-inline-start:28px}
.page li.ok{font-weight:700}
.page table{border-collapse:collapse;margin:8px 0 14px;font-size:16px}
.page td,.page th{border:1px solid #999;padding:4px 8px}
.page .note{color:var(--muted);font-size:15px;font-family:Arial,sans-serif}
.empty{color:var(--muted)}
/* edit mode */
.editing [data-p]{outline:none;border-radius:3px;transition:background .15s}
.editing [data-p]:hover{background:#f6f6f6}
.editing [data-p]:focus{background:var(--edit)}
.editing [data-p]:empty::before{content:attr(data-ph);color:#aaa}
.editing li.ok::after{content:" ✓"}
#tb{position:absolute;z-index:2;display:flex;gap:4px;font:13px Arial,sans-serif}
#tb[hidden]{display:none}
#tb button{font:inherit;padding:3px 9px;border:1px solid #bbb;border-radius:5px;background:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#tb button.del{color:#b00020}
@media (max-width:640px){.page{padding:28px 18px;font-size:17px}}
@media print{.bar,.pick,#tb{display:none}body{background:#fff}.page{box-shadow:none;margin:0;max-width:none;padding:0}}
</style>
</head>
<body>
<div class="bar">
  <a href="index.html">לדף הבית</a>
  <label><input type="checkbox" id="optQ" checked> שאלות</label>
  <label><input type="checkbox" id="optA" checked> סימון תשובה נכונה</label>
  <label><input type="checkbox" id="optX"> טבלאות וסיכומים</label>
  <button type="button" id="copy">העתקה</button>
  <button type="button" id="word">הורדה כקובץ Word</button>
  <button type="button" id="edit" hidden>✎ עריכה</button>
  <button type="button" id="save" hidden disabled>שמירה</button>
  <span id="msg"></span>
</div>
<div class="pick"><details id="pickBox"><summary>בחירת שיעורים</summary><div id="pick"></div></details></div>
<div class="page" id="page"><p class="empty">טוען…</p></div>
<div id="tb" hidden></div>

<script type="module">
// Firebase is loaded only for the admin's editing, so reading never depends on it.
let auth = null, httpsCallable = null;

const ADMIN_EMAIL = "ufd5a4a70e876fc8672e3d112e6866c55@arba-avot-users.local";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
let GROUPS = [], DATA = {}, EDIT = false, fns = null;
const DIRTY = new Set();

// ---------- loading ----------
// Lesson list and order come from the home page.
async function loadIndex() {
  const doc = new DOMParser().parseFromString(await (await fetch("index.html", { cache: "no-cache" })).text(), "text/html");
  GROUPS = [...doc.querySelectorAll(".group-panel")].map((g) => ({
    name: (g.querySelector(".group-title") || {}).textContent.trim(),
    lessons: [...g.querySelectorAll("a.lesson-card")].map((a) => ({ href: a.getAttribute("href"), title: a.textContent.trim() })),
  }));
}

const evalLesson = (src) => JSON.parse(src);
const dataUrl = (href) => href.replace(/^lessons\/([^/]+)\.html$/, "lessons/data/$1.json");

// Lesson content lives in lessons/data/<id>.json; a page without one is
// read from its own HTML (older format, .intro-box).
async function loadLesson(href) {
  const r = await fetch(dataUrl(href), { cache: "no-cache" });
  if (r.ok) return { kind: "new", L: await r.json() };
  const html = await (await fetch(href, { cache: "no-cache" })).text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  return { kind: "old", title: (doc.querySelector(".lesson-title") || {}).textContent || href,
    ref: (doc.querySelector(".lesson-source") || {}).textContent || "", boxes: [...doc.querySelectorAll(".intro-box")] };
}

// For editing, read the lesson straight from the repository (the site
// itself can lag a few minutes behind a save) and remember that exact
// source, so the server can refuse to overwrite a newer version.
async function loadForEdit(href) {
  const d = DATA[href];
  if (d && d.base) return;
  if (d && d.kind === "old") return;
  try {
    const res = await httpsCallable(fns, "getLessonData")({ path: href });
    DATA[href] = { kind: "new", L: evalLesson(res.data.src), base: res.data.src };
  } catch (e) {
    if (!d) DATA[href] = await loadLesson(href).catch(() => null);
    if (DATA[href]) DATA[href].noEdit = true;
  }
}

// ---------- rendering ----------
const clean = (s) => String(s).replace(/<(?!\/?(b|strong|i|em)\b)[^>]*>/g, "");
function table(t) {
  return `<table><tr>${t.cols.map((c) => `<th>${clean(c)}</th>`).join("")}</tr>${t.rows.map((r) => `<tr>${r.map((c) => `<td>${clean(c && c.v !== undefined ? c.v : c)}</td>`).join("")}</tr>`).join("")}</table>`;
}

// ed(path, html, placeholder): an editable piece in edit mode, plain text otherwise.
function renderNew(href, d, o) {
  const L = d.L, editable = EDIT && !d.noEdit && d.base;
  const ed = (p, v, ph = "") => editable ? ` contenteditable="true" data-h="${esc(href)}" data-p="${p}" data-ph="${esc(ph)}">${v}` : `>${clean(v)}`;
  let h = `<h1>${clean(L.title)}</h1><p class="ref">${esc(L.ref || "")}</p>`, last = -1;
  if (EDIT && !editable) h += `<p class="note">את השיעור הזה אי אפשר לערוך מכאן.</p>`;
  L.screens.forEach((s, si) => {
    const shown = s.type === "read" || (o.q && !["intro", "summary"].includes(s.type));
    if (shown && s.st !== undefined && s.st !== last && L.stations[s.st] !== undefined) {
      h += `<h2${ed("st." + s.st, L.stations[s.st], "כותרת")}</h2>`; last = s.st;
    }
    if (s.type === "intro") { if (o.x && s.question) h += `<p>${clean(s.question)}</p>`; return; }
    if (s.type === "read") {
      if (s.kicker) h += `<p><b${ed("kk." + si, s.kicker)}</b></p>`;
      (s.comic || []).forEach((p) => h += `<p>${clean(p[1])}</p>`);
      (s.text || []).forEach((t, ti) => h += `<p${ed(`tx.${si}.${ti}`, t, "טקסט")}</p>`);
      if (s.quote) h += `<p>${clean(s.quote)}</p>`;
      ["before", "after"].forEach((side) => (s[side] || []).forEach((b, bi) => {
        if (b.k === "gloss") b.items.forEach((g, gi) => h += `<p${ed(`gl.${si}.${side}.${bi}.${gi}`, g)}</p>`);
        else if (o.x && b.k === "short") h += `<p><b>בקיצור:</b> ${clean(b.text)}</p>`;
        else if (o.x && b.k === "cards") h += `<p>${b.items.map((c) => `<b>${clean(c.t)}:</b> ${clean(c.s)}`).join(" · ")}</p>`;
      }));
      return;
    }
    if (s.type === "summary") { if (o.x && s.table) h += `<h2>סיכום</h2>` + table(s.table); return; }
    if (!o.q) return;
    const opts = (list, a) => `<ol>${list.map((x, i) => `<li class="${o.a && i === a ? "ok" : ""}"${ed(`o.${si}.${i}`, x)}${!editable && o.a && i === a ? " ✓" : ""}</li>`).join("")}</ol>`;
    if (s.type === "mc") h += `<p class="q"${ed("q." + si, s.q)}</p>` + opts(s.o, s.a);
    else if (s.type === "fill") h += `<p class="q">${clean(s.before)} ___ ${clean(s.after)}</p>` + opts(s.o, s.a);
    else if (s.type === "judge") h += `<p class="q">${s.sides.map((x) => clean(x[0] + ": " + x[1])).join(" / ")}</p>` + opts(s.o, s.a);
    else if (s.type === "tf") h += `<p class="q">נכון או לא נכון: <span${ed("tf." + si, s.s)}</span></p>` + (o.a ? `<p>${s.a ? "נכון" : "לא נכון"}</p>` : "");
    else if (s.q) h += `<p class="q">${clean(s.q)}</p>` + (o.a && s.ans ? `<p>${clean(s.ans)}</p>` : "");
  });
  return h;
}

function renderOld(d, o) {
  let h = `<h1>${esc(d.title.trim())}</h1><p class="ref">${esc(d.ref.trim())}</p>`;
  if (EDIT) h += `<p class="note">את השיעור הזה אי אפשר לערוך מכאן.</p>`;
  d.boxes.forEach((box) => box.querySelectorAll("h2,h3,p,li,.quiz,table").forEach((el) => {
    if (el.closest(".quiz") && !el.matches(".quiz")) return;
    if (el.closest("table") && el.tagName !== "TABLE") return;
    if (el.matches(".quiz")) {
      if (!o.q) return;
      const bs = [...el.querySelectorAll(".quiz-choice")], a = bs.findIndex((b) => b.dataset.correct === "true");
      h += `<p class="q">${esc(el.querySelector(".quiz-question").textContent)}</p><ol>${bs.map((b, i) => `<li class="${o.a && i === a ? "ok" : ""}">${esc(b.textContent)}${o.a && i === a ? " ✓" : ""}</li>`).join("")}</ol>`;
      return;
    }
    if (el.tagName === "TABLE") { if (o.x) h += el.outerHTML; return; }
    if (/^H/.test(el.tagName)) h += `<h2>${esc(el.textContent.trim())}</h2>`;
    else h += `<p>${clean(el.innerHTML.trim())}</p>`;
  }));
  return h;
}

const chosen = () => [...document.querySelectorAll("#pick input[data-href]:checked")].map((c) => c.dataset.href);
async function render(focus) {
  const o = { q: $("optQ").checked, a: $("optA").checked, x: $("optX").checked }, list = chosen();
  if (!list.length) { $("page").innerHTML = '<p class="empty">לא נבחרו שיעורים.</p>'; return; }
  await Promise.all(list.map(async (href) => {
    if (EDIT) await loadForEdit(href);
    else if (!DATA[href]) DATA[href] = await loadLesson(href).catch(() => null);
  }));
  $("page").classList.toggle("editing", EDIT);
  $("page").innerHTML = list.map((h) => {
    const d = DATA[h];
    return !d ? `<p class="empty">לא נטען: ${esc(h)}</p>` : d.kind === "new" ? renderNew(h, d, o) : renderOld(d, o);
  }).join("");
  hideTb();
  if (focus) {
    const el = document.querySelector(`[data-h="${CSS.escape(focus.h)}"][data-p="${focus.p}"]`);
    if (el) { el.focus(); placeCaret(el, focus.start); }
  }
}

function drawPick() {
  $("pick").innerHTML = `<label><input type="checkbox" id="all" checked> הכול</label>` + GROUPS.map((g, gi) => `<div class="grp"><label><input type="checkbox" data-g="${gi}" checked> ${esc(g.name)}</label><div class="ls">${g.lessons.map((l) => `<label><input type="checkbox" data-href="${esc(l.href)}" data-gi="${gi}" checked> ${esc(l.title)}</label>`).join("")}</div></div>`).join("");
  $("pick").onchange = (e) => {
    const t = e.target;
    if (t.id === "all") document.querySelectorAll("#pick input").forEach((c) => c.checked = t.checked);
    else if (t.dataset.g !== undefined) document.querySelectorAll(`#pick input[data-gi="${t.dataset.g}"]`).forEach((c) => c.checked = t.checked);
    render();
  };
}

// ---------- editing ----------
function cleanHtml(el) {
  return el.innerHTML
    .replace(/<br\s*\/?>/gi, " ").replace(/&nbsp;/g, " ")
    .replace(/<(\/?)(b|strong|i|em)(\s[^>]*)?>/gi, "\x01$1$2\x02").replace(/<[^>]*>/g, "")
    .replace(/\x01/g, "<").replace(/\x02/g, ">")
    .replace(/\s+/g, " ").trim();
}

function placeCaret(el, start) {
  const r = document.createRange();
  r.selectNodeContents(el);
  r.collapse(Boolean(start));
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

function setValue(L, p, v) {
  const a = p.split(".");
  const n = (i) => +a[i];
  switch (a[0]) {
    case "st": L.stations[n(1)] = v; break;
    case "kk": L.screens[n(1)].kicker = v; break;
    case "tx": L.screens[n(1)].text[n(2)] = v; break;
    case "gl": L.screens[n(1)][a[2]][n(3)].items[n(4)] = v; break;
    case "q": L.screens[n(1)].q = v; break;
    case "o": L.screens[n(1)].o[n(2)] = v; break;
    case "tf": L.screens[n(1)].s = v; break;
  }
}

function markDirty(href) {
  DIRTY.add(href);
  $("save").disabled = false;
  $("save").textContent = `שמירה (${DIRTY.size})`;
}

// Where a new screen for station k goes: before the first screen of a later station (or the summary).
function stationEnd(L, k) {
  const i = L.screens.findIndex((s) => s.type === "summary" || (s.st !== undefined && s.st > k));
  return i === -1 ? L.screens.length : i;
}

function dropStationIfEmpty(L, k) {
  if (L.screens.some((s) => s.st === k)) return;
  L.stations.splice(k, 1);
  L.screens.forEach((s) => { if (s.st !== undefined && s.st > k) s.st--; });
}

const OPS = {
  // new paragraph right after this one, in the same screen
  addParaAfter(L, si, ti) { L.screens[si].text.splice(ti + 1, 0, ""); return `tx.${si}.${ti + 1}`; },
  // new paragraph at the top of a heading's section
  addParaInStation(L, k) {
    const si = L.screens.findIndex((s) => s.type === "read" && s.st === k);
    if (si > -1) { L.screens[si].text.unshift(""); return `tx.${si}.0`; }
    const at = L.screens.findIndex((s) => s.st === k);
    const pos = at > -1 ? at : stationEnd(L, k);
    L.screens.splice(pos, 0, { type: "read", st: k, text: [""] });
    return `tx.${pos}.0`;
  },
  // new heading after this paragraph: whatever follows it in the section moves under the new heading
  addHeadingAfterPara(L, si, ti) {
    const S = L.screens[si], k = S.st;
    const rest = S.text.splice(ti + 1);
    L.screens.forEach((s, j) => {
      if (s.st === undefined || s.type === "summary") return;
      if (s.st > k) s.st++;
      else if (s.st === k && j > si) s.st = k + 1;
    });
    const N = { type: "read", st: k + 1, text: rest.length ? rest : [""] };
    if (rest.length && S.after) { N.after = S.after; delete S.after; }
    L.screens.splice(si + 1, 0, N);
    L.stations.splice(k + 1, 0, "");
    return `st.${k + 1}`;
  },
  addHeadingAfterHeading(L, k) {
    L.screens.forEach((s) => { if (s.st !== undefined && s.type !== "summary" && s.st > k) s.st++; });
    L.stations.splice(k + 1, 0, "");
    L.screens.splice(stationEnd(L, k), 0, { type: "read", st: k + 1, text: [""] });
    return `st.${k + 1}`;
  },
  delPara(L, si, ti) {
    const S = L.screens[si];
    S.text.splice(ti, 1);
    const prev = ti > 0 ? `tx.${si}.${ti - 1}` : null;
    if (!S.text.length && !(S.before || []).length && !(S.after || []).length && !S.comic && !S.quote && !S.kicker) {
      L.screens.splice(si, 1);
      dropStationIfEmpty(L, S.st);
    }
    return prev;
  },
  // removing a heading joins its section to the one before it
  delHeading(L, k) {
    if (k === 0) return null;
    L.screens.forEach((s) => { if (s.st !== undefined && s.type !== "summary" && s.st >= k) s.st = s.st === k ? k - 1 : s.st - 1; });
    L.stations.splice(k, 1);
    return `st.${k - 1}`;
  },
};

function runOp(el, name) {
  const href = el.dataset.h, a = el.dataset.p.split(".").map((x) => isNaN(x) ? x : +x);
  const L = DATA[href].L;
  setValue(L, el.dataset.p, cleanHtml(el));
  const next = OPS[name](L, ...a.slice(1));
  markDirty(href);
  render(next ? { h: href, p: next } : null);
}

// floating toolbar for the focused paragraph / heading
const tb = $("tb");
function hideTb() { tb.hidden = true; }
function showTb(el) {
  const kind = el.dataset.p.split(".")[0];
  if (kind !== "tx" && kind !== "st") return hideTb();
  const k = kind === "st" ? +el.dataset.p.split(".")[1] : null;
  const btns = kind === "tx"
    ? [["addParaAfter", "+ קטע"], ["addHeadingAfterPara", "+ כותרת"], ["delPara", "מחיקת קטע", "del"]]
    : [["addParaInStation", "+ קטע"], ["addHeadingAfterHeading", "+ כותרת"], ...(k > 0 ? [["delHeading", "מחיקת כותרת", "del"]] : [])];
  tb.innerHTML = btns.map(([op, t, c]) => `<button type="button" data-op="${op}" class="${c || ""}">${t}</button>`).join("");
  const r = el.getBoundingClientRect();
  tb.style.top = `${r.top + scrollY - 30}px`;
  tb.style.left = `${r.left + scrollX}px`;
  tb.hidden = false;
  tb.ed = el;
}
tb.addEventListener("mousedown", (e) => e.preventDefault());
tb.addEventListener("click", (e) => {
  const b = e.target.closest("[data-op]");
  if (!b || !tb.ed) return;
  if (b.dataset.op === "delPara" && cleanHtml(tb.ed) && !confirmInline(b)) return;
  runOp(tb.ed, b.dataset.op);
});
// deleting a paragraph that has text takes a second click
function confirmInline(b) {
  if (b.dataset.sure) return true;
  b.dataset.sure = "1"; b.textContent = "למחוק? לחצו שוב";
  return false;
}

const page = $("page");
page.addEventListener("focusin", (e) => { const el = e.target.closest("[data-p]"); if (el) showTb(el); });
page.addEventListener("focusout", (e) => {
  const el = e.target.closest("[data-p]");
  if (!el) return;
  setTimeout(() => { if (!page.contains(document.activeElement) || !document.activeElement.dataset.p) hideTb(); }, 0);
});
page.addEventListener("input", (e) => {
  const el = e.target.closest("[data-p]");
  if (!el) return;
  setValue(DATA[el.dataset.h].L, el.dataset.p, cleanHtml(el));
  markDirty(el.dataset.h);
});
page.addEventListener("keydown", (e) => {
  const el = e.target.closest("[data-p]");
  if (!el) return;
  const kind = el.dataset.p.split(".")[0];
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (kind === "tx") runOp(el, "addParaAfter");
    else if (kind === "st") runOp(el, "addParaInStation");
    else el.blur();
  } else if (e.key === "Enter") e.preventDefault();
  else if (e.key === "Backspace" && kind === "tx" && !el.textContent.trim()) {
    e.preventDefault();
    runOp(el, "delPara");
  }
});
// paste as plain text, so formatting from Word or other sites doesn't come along
page.addEventListener("paste", (e) => {
  if (!e.target.closest("[data-p]")) return;
  e.preventDefault();
  document.execCommand("insertText", false, (e.clipboardData.getData("text/plain") || "").replace(/\s*\n\s*/g, " "));
});

// before saving: drop empty paragraphs; every heading needs a name
function tidy(L) {
  for (let si = L.screens.length - 1; si >= 0; si--) {
    const S = L.screens[si];
    if (S.type !== "read" || !S.text) continue;
    for (let ti = S.text.length - 1; ti >= 0; ti--) if (!S.text[ti].replace(/<[^>]*>/g, "").trim()) OPS.delPara(L, si, ti);
  }
  return L.stations.findIndex((s) => !s.replace(/<[^>]*>/g, "").trim());
}

$("save").onclick = async () => {
  const btn = $("save");
  for (const href of DIRTY) {
    const k = tidy(DATA[href].L);
    if (k > -1) { render({ h: href, p: `st.${k}` }); return say("יש כותרת ריקה. כתבו בה משהו או מחקו אותה.", true); }
  }
  btn.disabled = true; say("שומר…");
  try {
    for (const href of [...DIRTY]) {
      const d = DATA[href];
      const res = await httpsCallable(fns, "saveLessonData")({ path: href, lesson: d.L, base: d.base });
      d.base = res.data.src;
      d.L = evalLesson(d.base);
      DIRTY.delete(href);
    }
    btn.textContent = "שמירה";
    say("נשמר ✓ (באתר זה יופיע בעוד דקה-שתיים)");
  } catch (err) {
    btn.disabled = false;
    say((err && err.message) || "שגיאה בשמירה", true);
  }
  render();
};

$("edit").onclick = async () => {
  if (EDIT && DIRTY.size) return say("יש שינויים שלא נשמרו. שמרו קודם.", true);
  EDIT = !EDIT;
  $("edit").classList.toggle("on", EDIT);
  $("edit").textContent = EDIT ? "✓ סיום עריכה" : "✎ עריכה";
  $("save").hidden = !EDIT;
  if (EDIT && !fns) {
    try {
      const f = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js");
      httpsCallable = f.httpsCallable;
      fns = f.getFunctions(auth.getApp());
    } catch (e) {
      EDIT = false; $("edit").classList.remove("on"); $("edit").textContent = "✎ עריכה"; $("save").hidden = true;
      return say("לא הצלחתי לטעון את העריכה. נסו לרענן את הדף.", true);
    }
  }
  if (EDIT) say("טוען לעריכה…");
  await render();
  if (EDIT) say("לוחצים על טקסט או כותרת כדי לערוך. Enter מוסיף קטע חדש.");
};
addEventListener("beforeunload", (e) => { if (DIRTY.size) { e.preventDefault(); e.returnValue = ""; } });

import("./assets/js/auth.js").then((m) => {
  auth = m;
  m.watchAuthState((user) => { $("edit").hidden = !(user && user.email === ADMIN_EMAIL); });
}).catch(() => {});

// ---------- copy / Word ----------
let sayT;
function say(t, err) {
  $("msg").textContent = t; $("msg").classList.toggle("err", Boolean(err));
  clearTimeout(sayT); if (!err) sayT = setTimeout(() => $("msg").textContent = "", 4000);
}
$("copy").onclick = async () => {
  const html = $("page").innerHTML, text = $("page").innerText;
  try { await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([text], { type: "text/plain" }) })]); say("הועתק"); }
  catch (e) { const r = document.createRange(); r.selectNodeContents($("page")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); say("הטקסט מסומן, אפשר להעתיק עם Ctrl+C"); }
};
$("word").onclick = () => {
  const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{direction:rtl;font-family:David,'Times New Roman',serif;font-size:14pt}td,th{border:1px solid #999;padding:3pt 6pt}table{border-collapse:collapse}</style></head><body dir="rtl">${$("page").innerHTML.replace(/ contenteditable="true"/g, "")}</body></html>`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + doc], { type: "application/msword" }));
  a.download = "פשיטא.doc"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
["optQ", "optA", "optX"].forEach((id) => $(id).onchange = () => render());

loadIndex().then(() => { drawPick(); render(); }).catch(() => { $("page").innerHTML = '<p class="empty">לא הצלחתי לטעון את רשימת השיעורים.</p>'; });
</script>
