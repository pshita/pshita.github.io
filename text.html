<style>
/* plain continuous text of the lessons, like a word-processor page */
:root{--ink:#111;--muted:#666;--line:#ddd;--desk:#e9e9ec;--page:#fff;--accent:#1a5fb4;--edit:#fff8d6;--text:'Frank Ruhl Libre',David,'Times New Roman',serif}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Arial,'Segoe UI',sans-serif}
/* the top bar hides; the mouse at the top of the screen (or a tap there) brings it back */
/* a solid strip along the top: more room to tap for the bar, and a hard edge (no blur
   over the text when scrolling, as Safari does under the status bar) */
#hot{position:fixed;top:0;left:0;right:0;height:22px;z-index:2;cursor:pointer;background:var(--page)}
/* bar and menus: same look as the site header and its menu (assets/css/style.css) */
:root{--s-bg:#faf6ee;--s-ink:#2b241b;--s-soft:#5c5347;--s-line:#e4d9c4;--s-accent-soft:#f1e3d1;--s-accent-strong:#6d3a22;--s-head:"Rubik","Heebo","Arial Hebrew",sans-serif}
.bar{position:fixed;top:0;left:0;right:0;z-index:3;transform:translateY(-100%);transition:transform .18s;background:#fff;border-bottom:1px solid var(--s-line);box-shadow:0 2px 10px rgba(43,36,27,.08);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--s-head);color:var(--s-ink)}
.bar.show{transform:none}
.bar button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
/* the site's menu, exactly as on every other page (site-header.css), inside this bar */
.site-header.sh-inline{position:static;border:0;background:none;box-shadow:none}
.bar .view{display:flex;align-items:center;gap:6px;font-size:.95rem;padding:8px 10px;border-radius:8px}
.bar .view:hover,.bar .view.open{background:var(--s-accent-soft);color:var(--s-accent-strong)}
.chev{width:16px;height:16px;flex:none;transition:transform .2s}
.view.open .chev,.sec.open>.sec-h .chev{transform:rotate(180deg)}
.panel{position:fixed;z-index:4;min-width:220px;max-width:calc(100vw - 16px);max-height:min(430px,calc(100vh - 90px));overflow-y:auto;background:#fff;border:1px solid var(--s-line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:10px;display:flex;flex-direction:column;gap:6px;font-family:var(--s-head);color:var(--s-ink);line-height:1.75}
.panel *{flex-shrink:0}
.panel[hidden]{display:none}
.panel a,.panel label,.sec-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--s-ink);text-decoration:none;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.panel a:hover,.panel label:hover,.sec-h:hover{background:var(--s-accent-soft);color:var(--s-accent-strong)}
.sec-h{width:100%;justify-content:space-between;border:0;background:none;font-family:"Heebo","Arial Hebrew",sans-serif;line-height:normal;text-align:start}
.sec-b{margin:4px 0 0;padding:6px;border:1px solid var(--s-line);border-radius:8px;background:var(--s-bg);display:flex;flex-direction:column;gap:2px}
.sec:not(.open) .sec-b{display:none}
.sec-b a,.sec-b label{font-size:.88rem}
.panel label.new{color:var(--s-soft)}
.panel .opt{border-bottom:1px solid var(--s-line);border-radius:8px 8px 0 0;padding-bottom:10px}
.panel .acct{border-top:1px solid var(--s-line);padding-top:10px;margin-top:4px;display:flex;flex-direction:column;gap:6px}
/* adding, moving and deleting lessons (admin), in "תצוגה" */
.panel .lrow{display:flex;align-items:center}
.panel .lrow label{flex:1;min-width:0}
.panel .lctl{display:flex;flex:none}
.panel .lctl button{border:0;background:none;font:inherit;font-size:.85rem;color:var(--s-soft);padding:4px 6px;border-radius:6px;cursor:pointer}
.panel .lctl button:hover{background:var(--s-accent-soft);color:var(--s-accent-strong)}
.panel .lctl .del:hover{background:#f6d8d2;color:#b23b2e}
.panel .lrow.busy{opacity:.5;pointer-events:none}
.panel .newl>button{border:1px dashed var(--s-line);background:none;font:inherit;font-size:.88rem;color:var(--s-soft);border-radius:8px;padding:6px 10px;cursor:pointer;width:100%;text-align:start}
.panel .nl-form{display:flex;flex-direction:column;gap:6px;padding:6px 4px}
.panel .nl-form[hidden]{display:none}
.panel .nl-form label{flex-direction:column;align-items:stretch;gap:2px;padding:0;font-size:.85rem;cursor:default;white-space:normal}
.panel .nl-form label:hover{background:none;color:var(--s-ink)}
.panel .nl-form input{font:inherit;padding:4px 8px;border:1px solid var(--s-line);border-radius:6px}
.panel .nl-actions{display:flex;gap:6px}
.panel .nl-actions button{font:inherit;font-size:.85rem;border:1px solid var(--s-line);background:#fff;border-radius:6px;padding:3px 12px;cursor:pointer}
.panel .nl-status{margin:0;font-size:.8rem;color:#b23b2e;white-space:normal}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;max-width:calc(100vw - 32px);background:#b00020;color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#msg:empty{display:none}
/* undo / redo, in the top bar while editing */
#hist{display:flex}
#hist[hidden]{display:none}
.bar #hist button{width:38px;height:38px;border-radius:8px;font-size:20px;line-height:1}
.bar #hist button:hover:not(:disabled){background:var(--s-accent-soft);color:var(--s-accent-strong)}
.bar #hist button:disabled{opacity:.3;cursor:default}
/* bold / red on selected text */
/* search and replace, over every page shown */
.tools{display:flex;align-items:center;gap:6px}
.bar .icon{padding:8px}
/* pinching changes the text size (the lines rewrap), not the page zoom */
/* the page never gets wider than the screen and never moves sideways */
html,body{touch-action:pan-y;overflow-x:hidden;max-width:100%}
/* the iPhone can still pan sideways with only overflow-x:hidden; clip leaves nothing to pan to */
@supports (overflow-x:clip){html,body{overflow-x:clip}}
/* the text moves down below the open bar (and back): keep it where it is on screen, not where it was */
body{overflow-anchor:none;transition:padding-top .18s}
.page{overflow-wrap:break-word}
.bar .icon svg{width:20px;height:20px;display:block}
#find{position:fixed;top:10px;left:16px;z-index:6;background:#fff;border:1px solid var(--s-line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px;display:flex;flex-direction:column;gap:6px;font-family:var(--s-head);font-size:14px;max-width:calc(100vw - 32px)}
#find[hidden]{display:none}
#find .frow{display:flex;align-items:center;gap:4px}
#find input{font:inherit;width:190px;max-width:52vw;padding:6px 10px;border:1px solid var(--s-line);border-radius:8px;outline:none}
#find input:focus{border-color:#8a4b2e}
#find button{font:inherit;border:0;background:none;padding:5px 8px;border-radius:7px;cursor:pointer;color:var(--s-ink);white-space:nowrap}
#find button:hover{background:var(--s-accent-soft);color:var(--s-accent-strong)}
#findN{color:var(--s-soft);font-size:12px;min-width:44px;text-align:center}
::highlight(hits){background:#ffe58a}
::highlight(hit-now){background:#f0a33c;color:#000}
#fmt{position:absolute;z-index:4;display:flex;gap:2px;background:#222;border-radius:7px;padding:3px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#fmt[hidden]{display:none}
#fmt button{width:30px;height:28px;border:0;border-radius:5px;background:none;color:#fff;font:700 15px Arial,sans-serif;cursor:pointer}
#fmt button:hover{background:#444}
#fmt .red{color:#ff8a7a}
#fmt .it{font-style:italic;font-family:Georgia,serif}
#fmt .hd{width:auto;padding:0 8px;font-size:13px;border-inline-start:1px solid #555;border-radius:0 5px 5px 0}
.page{min-height:100vh;background:var(--page);padding:22px clamp(16px,3vw,40px) 48px;font-family:var(--text);font-size:var(--fs,17px);line-height:1.4}
/* the lesson's name, and on the same line its page and amud */
.page .lh{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 16px;margin:0 0 14px}
.page .lsn+.lsn .lh{margin-top:40px;padding-top:26px;border-top:1px solid var(--line)}
.page h1{font-size:1.47em;font-weight:700;margin:0;flex:1 1 auto;min-width:40%}
.page .ref{color:var(--muted);font-size:.82em;margin:0;flex:0 1 auto}
/* the site's boxes (בקיצור, השוואה, מונחים...), marked with a line at the side */
.page .blk{border-inline-start:3px solid var(--s-line);padding-inline-start:10px}
.page .blk .lbl{color:var(--muted);font-weight:700}
.page .icard .iw{color:var(--muted)}
.page h2{font-size:1.12em;font-weight:700;margin:20px 0 4px}
.page p{margin:0 0 6px;text-align:justify}
.page .q{margin:10px 0 2px;font-weight:700}
.page ol{list-style-type:hebrew;margin:0 0 8px;padding-inline-start:28px}
.page li.ok{font-weight:700}
.page li.ok::after{content:" ✓"}
.page table{border-collapse:collapse;margin:8px 0 12px;font-size:.88em;max-width:100%}
.page table.fit{width:100%;table-layout:fixed}
.page td,.page th{border:1px solid #999;padding:3px 8px}
.page .note{color:var(--muted);font-size:14px;font-family:Arial,sans-serif}
.empty{color:var(--muted)}
.page [data-ph]:empty::before{content:attr(data-ph);color:#aaa}
/* edit mode (double-click any text, admin only) */
/* the whole page is one editing area: select and delete across paragraphs like in a document */
.page.editing{outline:none}
.editing [data-p]{border-radius:3px;transition:background .15s}
.editing [data-p]:hover{background:#f6f6f6}
.editing .cur{background:var(--edit)}
.editing span[data-p],.editing b[data-p]{display:inline-block;min-width:.6em;max-width:100%}
#tb{position:absolute;z-index:2;font:13px Arial,sans-serif}
#tb[hidden]{display:none}
#tb{display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100vw - 16px)}
#tb button{font:inherit;padding:3px 10px;border:1px solid #bbb;border-radius:5px;background:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#tb button:hover{border-color:#8a4b2e;color:#6d3a22}
@media (max-width:640px){.page{padding:20px 14px 40px;font-size:var(--fs,16px)}}
@media print{.bar,.panel,#tb,#hot,#fmt,#msg,#find,#hist{display:none}body{background:#fff}.page{padding:0;min-height:0}}

<script type="module">
// Pages shown here, by key:
//   "lessons/<id>.html" - a lesson on the site (content in lessons/data/<id>.json, saved to GitHub)
//   "draft:<id>"        - a lesson being written, not on the site yet (Firestore, admin only)
//   "draft:new"         - the empty page at the end of the "עריכה" menu; typing in it makes it a draft
// Firebase is loaded only for the admin, so reading never depends on it.
let auth = null, httpsCallable = null, fns = null, fs = null, isAdmin = false;

const ADMIN_EMAIL = "ufd5a4a70e876fc8672e3d112e6866c55@arba-avot-users.local";
const SEL_KEY = "pshita.text.selected";
const NEW = "draft:new";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const isDraft = (key) => key.startsWith("draft:");
let GROUPS = [], DRAFTS = [], DATA = {}, EDIT = false;
let SELECTED = [];

// ---------- loading ----------
async function loadIndex() {
  const site = await (await fetch("lessons.json", { cache: "no-cache" })).json();
  GROUPS = site.groups.map((g) => ({ name: g.title, lessons: g.lessons.map((l) => ({ key: `lessons/${l.id}.html`, title: l.title })) }));
}

const dataUrl = (href) => href.replace(/^lessons\/([^/]+)\.html$/, "lessons/data/$1.json");
const newDraftData = () => ({ title: "", ref: "", stations: [""], screens: [{ type: "read", st: 0, text: [""] }] });

async function loadLesson(href) {
  const r = await fetch(dataUrl(href), { cache: "no-cache" });
  if (!r.ok) throw new Error(r.status);
  return { L: await r.json() };
}

// For editing, read the lesson straight from the repository (the site
// itself can lag a few minutes behind a save) and remember that exact
// source, so the server can refuse to overwrite a newer version.
async function loadForEdit(href) {
  const d = DATA[href];
  if (d && d.base) return;
  try {
    const res = await httpsCallable(fns, "getLessonData")({ path: href });
    DATA[href] = { L: JSON.parse(res.data.src), base: res.data.src };
  } catch (e) {
    if (!d) DATA[href] = await loadLesson(href).catch(() => null);
    if (DATA[href]) { DATA[href].noEdit = true; DATA[href].why = (e && e.message) || ""; }
  }
}

async function loadDrafts() {
  const snap = await fs.getDocs(fs.collection(auth.getDb(), "drafts"));
  DRAFTS = [];
  snap.forEach((doc) => {
    const v = doc.data();
    let L;
    try { L = JSON.parse(v.data); } catch (e) { return; }
    // a page left completely empty goes
    if (draftEmpty(L)) { fs.deleteDoc(doc.ref).catch(() => {}); return; }
    DRAFTS.push({ id: doc.id, createdAt: v.createdAt || 0 });
    DATA["draft:" + doc.id] = { L, draft: true, createdAt: v.createdAt || 0 };
  });
  DRAFTS.sort((a, b) => a.createdAt - b.createdAt);
  DATA[NEW] = { L: newDraftData(), draft: true };
}

// ---------- rendering ----------
// Text keeps only bold, italic and red; every other tag or attribute (colors
// from the lesson design, formatting pasted from elsewhere) is dropped.
const RED = '<span style="color:#B5432A">';
const isRedEl = (n) => n.style.color === "rgb(181, 67, 42)" || (n.getAttribute("color") || "").toLowerCase() === "#b5432a";
function ser(node, keepColor = true) {
  let out = "";
  node.childNodes.forEach((n) => {
    if (n.nodeType === 3) { out += n.textContent.replace(/\u00a0/g, " ").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); return; }
    if (n.nodeType !== 1) return;
    const t = n.tagName, inner = ser(n, keepColor);
    if (t === "BR") out += " ";
    else if (!inner) return;
    else if (keepColor && (t === "B" || t === "STRONG") && n.style.color && !isRedEl(n)) out += `<b style="color:${n.style.color}">${inner}</b>`;  // the lesson's colored key words
    else if (t === "B" || t === "STRONG" || (t === "SPAN" && /^(bold|[6-9]00)$/.test(n.style.fontWeight))) out += `<${t === "STRONG" ? "strong" : "b"}>${inner}</${t === "STRONG" ? "strong" : "b"}>`;
    else if (t === "I" || t === "EM") out += `<i>${inner}</i>`;
    else if ((t === "SPAN" || t === "FONT") && isRedEl(n)) out += `${RED}${inner}</span>`;
    else out += inner;
  });
  return out;
}
const tpl = document.createElement("template");
// for reading: the design's colored key words show as plain bold (saving keeps them)
const clean = (s) => { tpl.innerHTML = String(s); return ser(tpl.content, false); };
const plain = (s) => { tpl.innerHTML = String(s); return tpl.content.textContent.trim(); };

// Every editable piece carries its place in the lesson data (data-p), so a
// double-click can find it again once edit mode is on.
function renderLesson(key, d, q) {
  const L = d.L, editable = EDIT && (d.draft || (!d.noEdit && d.base));
  const ed = (p, v, ph = "") => ` data-h="${esc(key)}" data-p="${p}" data-ph="${esc(ph)}">` + (editable ? v : clean(v));
  // in edit mode the page is one editing area; text that isn't part of the lesson data is locked
  const ro = (html) => (EDIT ? `<span contenteditable="false">${html}</span>` : html), roA = EDIT ? ' contenteditable="false"' : "";
  let h = `<div class="lh"><h1${ed("tt", L.title, "שם השיעור")}</h1><p class="ref"${ed("rf", L.ref || "", "דף ועמוד")}</p></div>`;
  if (EDIT && !editable) h += `<p class="note"${roA}>את השיעור הזה אי אפשר לערוך כרגע${d.why ? ` (${esc(d.why)})` : ""}.</p>`;
  let last = -1;
  L.screens.forEach((s, si) => {
    const shown = s.type === "read" || (q && !["intro", "summary"].includes(s.type));
    if (shown && s.st !== undefined && s.st !== last && L.stations[s.st] !== undefined) {
      h += `<h2${ed("st." + s.st, L.stations[s.st], "כותרת")}</h2>`; last = s.st;
    }
    if (s.type === "intro") {
      if (s.question) h += `<p${ed("iq." + si, s.question)}</p>`;
      // the big cards of the opening screen: name, line, and where it's written
      (s.cards || []).forEach((c, ci) => {
        h += `<p class="icard"><b${ed(`ict.${si}.${ci}`, c.t || "")}</b>${ro(": ")}<span${ed(`ics.${si}.${ci}`, c.s || "")}</span>` + (c.w !== undefined ? ` <span class="iw">${ro("(")}<span${ed(`icw.${si}.${ci}`, c.w)}</span>${ro(")")}</span>` : "") + `</p>`;
      });
      return;
    }
    if (s.type === "read") {
      if (s.kicker) h += `<p><b${ed("kk." + si, s.kicker)}</b></p>`;
      (s.comic || []).forEach((p) => h += `<p${roA}>${clean(p[1])}</p>`);
      (s.text || []).forEach((t, ti) => h += `<p${ed(`tx.${si}.${ti}`, t, "טקסט")}</p>`);
      if (s.quote) h += `<p${roA}>${clean(s.quote)}</p>`;
      // the site's boxes; each box's pieces carry its place as "<si>.<side>.<bi>"
      ["before", "after"].forEach((side) => (s[side] || []).forEach((b, bi) => {
        const at = `${si}.${side}.${bi}`, lbl = (t) => ro(`<span class="lbl">${t}:</span> `);
        if (b.k === "gloss") b.items.forEach((g, gi) => h += `<p class="blk">${gi ? "" : lbl("מונחים")}<span${ed(`gl.${at}.${gi}`, g, "מונח: הסבר")}</span></p>`);
        else if (b.k === "short") h += `<p class="blk">${lbl("בקיצור")}<span${ed(`sh.${at}`, b.text, "המשפט המסכם")}</span></p>`;
        else if (b.k === "cards") h += `<p class="blk">${lbl("השוואה")}${b.items.map((c, ci) => `<b${ed(`ct.${at}.${ci}`, c.t, "כותרת")}</b>${ro(": ")}<span${ed(`cs.${at}.${ci}`, c.s, "הסבר")}</span>`).join(ro(" · "))}</p>`;
        else if (b.k === "pills") h += `<p class="blk">${lbl("מילים מסומנות")}${b.items.map((w, wi) => `<span${ed(`pl.${at}.${wi}`, w, "מילה")}</span>`).join(ro(" · "))}</p>`;

  return `<section class="lsn" data-key="${esc(key)}"${EDIT && !editable ? ' contenteditable="false"' : ""}>${h}</section>`;
}

async function render(focus) {
  const list = SELECTED.filter((k) => !isDraft(k) || DATA[k]);
  if (!list.length) { $("page").innerHTML = '<p class="empty">בחרו שיעור בתפריט למעלה.</p>'; return; }
  await Promise.all(list.map(async (key) => {
    if (isDraft(key)) return;
    if (EDIT) await loadForEdit(key);
    else if (!DATA[key]) DATA[key] = await loadLesson(key).catch(() => null);
  }));
  const page = $("page");
  page.classList.toggle("editing", EDIT);
  page.contentEditable = EDIT ? "true" : "false";
  histButtons();
  page.innerHTML = list.map((k) => {
    const d = DATA[k];
    return d ? renderLesson(k, d, SHOWQ) : `<p class="empty"${EDIT ? ' contenteditable="false"' : ""}>לא נטען: ${esc(k)}</p>`;
  }).join("");
  CUR = null;
  fitTables();
  if (RESTORE && !focus) goToPos();
  if (EDIT) page.querySelectorAll("[data-p]").forEach((el) => { if (el.isContentEditable) BASE.set(el, cleanHtml(el)); });
  hideTb();

    const el = focus.p && document.querySelector(`[data-h="${CSS.escape(focus.h)}"][data-p="${focus.p}"]`);
    if (focus.point) {
      // edit mode can shift the layout a little: keep the clicked piece where it was
      if (el && focus.top !== undefined) scrollBy(0, el.getBoundingClientRect().top - focus.top);
      const r = el && el.getBoundingClientRect(), inside = r && focus.point.y >= r.top && focus.point.y <= r.bottom;
      if (el && !inside) placeCaret(el, false);
      else { placeCaretAtPoint(page, focus.point); snapCaret(el || document.elementFromPoint(focus.point.x, focus.point.y)); }
    }
    else if (el && focus.offset !== undefined) placeCaretAtOffset(el, focus.offset);
    else if (el) placeCaret(el, focus.start);
  }
}

// ---------- search and replace ----------
// Matches are found in the text of every page shown and marked with the CSS
// Highlight API, so the page itself isn't touched. Replacing changes the
// lesson data (like typing) and saves the usual way; text outside the lesson
// data (summaries, tables) can be found but not replaced.
const BLOCKS = "h1,h2,p,li,td,th";
let HITS = [], NOW = -1;
function findAll(q) {
  const hits = [];
  if (!q) return hits;
  $("page").querySelectorAll(BLOCKS).forEach((block) => {
    if (block.querySelector(BLOCKS)) return;
    const nodes = [], walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
    let text = "", n;
    while ((n = walker.nextNode())) { nodes.push([n, text.length]); text += n.data; }
    const at = (i) => { let k = nodes.length - 1; while (k > 0 && nodes[k][1] > i) k--; return [nodes[k][0], i - nodes[k][1]]; };
    for (let i = text.indexOf(q); i > -1; i = text.indexOf(q, i + q.length)) {
      const r = document.createRange();
      r.setStart(...at(i));
      const [en, eo] = at(i + q.length - 1);
      r.setEnd(en, eo + 1);
      const host = r.startContainer.parentElement.closest("[data-p]");
      hits.push({ r, block, el: host && host.contains(r.endContainer) && block.contains(host) ? host : null });
    }
  });
  return hits;
}
function paintHits() {
  if (!window.Highlight || !CSS.highlights) return;
  CSS.highlights.set("hits", new Highlight(...HITS.map((h) => h.r)));
  CSS.highlights.set("hit-now", NOW > -1 ? new Highlight(HITS[NOW].r) : new Highlight());
}
function showHit(scroll = true) {

  paintHits();

  if (rect.top < 60 || rect.bottom > innerHeight - 20) scrollBy({ top: rect.top - innerHeight / 3, behavior: "smooth" });
}
// Re-run the search (after typing in it, a render, or a replace); keep about the same place.
function runFind(scroll = true) {

  showHit(scroll);
}

}

}

function snapCaret(target) {

function placeCaret(el, start) {

function setValue(L, p, v) {
  const a = p.split(".");
  const n = (i) => +a[i];
  switch (a[0]) {
    case "tt": L.title = v; break;
    case "st": L.stations[n(1)] = v; break;
    case "kk": L.screens[n(1)].kicker = v; break;
    case "tx": L.screens[n(1)].text[n(2)] = v; break;
    case "gl": L.screens[n(1)][a[2]][n(3)].items[n(4)] = v; break;
    case "pl": L.screens[n(1)][a[2]][n(3)].items[n(4)] = plain(v); break;
    // a verse is shown as before + word + after, so the spaces around the word are kept in the data
    case "vb": L.screens[n(1)][a[2]][n(3)].items[n(4)].before = v ? v + " " : ""; break;
    case "vw": L.screens[n(1)][a[2]][n(3)].items[n(4)].word = v; break;
    case "va": L.screens[n(1)][a[2]][n(3)].items[n(4)].after = v ? " " + v : ""; break;
    case "vs": L.screens[n(1)][a[2]][n(3)].items[n(4)].src = plain(v); break;
    case "q": L.screens[n(1)].q = v; break;
    case "o": L.screens[n(1)].o[n(2)] = v; break;
    case "tf": L.screens[n(1)].s = v; break;
    case "iq": L.screens[n(1)].question = v; break;
    case "ict": L.screens[n(1)].cards[n(2)].t = v; break;
    case "ics": L.screens[n(1)].cards[n(2)].s = v; break;
    case "icw": L.screens[n(1)].cards[n(2)].w = v; break;
    case "rf": {
      L.ref = plain(v);
      // the opening screen shows it too ("בבא קמא · דף ב, עמוד א")
      const intro = L.screens.find((x) => x.type === "intro");
      if (intro && intro.daf && intro.daf.includes(" · ")) intro.daf = intro.daf.split(" · ")[0] + " · " + L.ref;
      break;
    }
    case "sh": L.screens[n(1)][a[2]][n(3)].text = v; break;
    case "ct": L.screens[n(1)][a[2]][n(3)].items[n(4)].t = v; break;
    case "cs": L.screens[n(1)][a[2]][n(3)].items[n(4)].s = v; break;
    case "tc": L.screens[n(1)].table.cols[n(2)] = v; break;
    case "tr": {
      const row = L.screens[n(1)].table.rows[n(2)], c = row[n(3)];
      if (c && typeof c === "object") c.v = v; else row[n(3)] = v;
      break;
    }

}

// Where a new screen for station k goes: before the first screen of a later station (or the summary).
function stationEnd(L, k) {
  const i = L.screens.findIndex((s) => s.type === "summary" || (s.st !== undefined && s.st > k));
  return i === -1 ? L.screens.length : i;
}

function dropStationIfEmpty(L, k) {
  if (L.screens.some((s) => s.st === k)) return;
  L.stations.splice(k, 1);
  L.screens.forEach((s) => { if (s.st !== undefined && s.st > k) s.st--; });

// The site's boxes that can be added from here, as they start out, and the first / last
// piece of each one's items.
const NEW_ITEM = {
  gloss: () => "",
  pills: () => "",
  cards: (prev) => ({ t: "", s: "", c: prev && prev.c === "red" ? "teal" : "red" }),
  verses: (prev) => ({ src: "", before: "", word: "", after: "", c: (prev && prev.c) || "red" }),
};
const NEW_BLOCK = {
  short: () => ({ k: "short", text: "" }),
  cards: () => ({ k: "cards", items: [NEW_ITEM.cards(), NEW_ITEM.cards({ c: "red" })] }),
  gloss: () => ({ k: "gloss", items: [""] }),
  verses: () => ({ k: "verses", items: [NEW_ITEM.verses()] }),
  pills: () => ({ k: "pills", items: [""] }),

const BLOCK_NAMES = { short: "בקיצור", cards: "השוואה", gloss: "מונחים", verses: "פסוקים", pills: "מילים מסומנות" };
const FIRST_PIECE = { short: "sh", cards: "ct", gloss: "gl", verses: "vb", pills: "pl" };
const LAST_PIECE = { short: "sh", cards: "cs", gloss: "gl", verses: "vs", pills: "pl" };

const itemText = (x) => plain(typeof x === "string" ? x : Array.isArray(x) ? x.map(itemText).join(" ")

const OPS = {

  splitPara(L, si, ti, rest) { L.screens[si].text.splice(ti + 1, 0, rest); return { p: `tx.${si}.${ti + 1}`, start: true }; },
  // Enter in a heading: a new paragraph at the top of its section
  addParaInStation(L, k) {

      const t = L.screens[si].text;

  // Enter in the title: to the first heading

  paraToHeading(L, si, ti) {

    S.text.splice(ti, 1);

      if (s.st === undefined || s.type === "summary") return;
      if (s.st > k) s.st++;
      else if (s.st === k && j > si) s.st = k + 1;

  pasteBlocks(L, si, ti, before, blocks, after) {

      else { if (i === 0 && plain(before)) items.push(before); items.push(H + b.name); }
    });

function runOp(el, name, ...extra) {
  const key = el.dataset.h, a = el.dataset.p.split(".").map((x) => isNaN(x) ? x : +x);
  const L = DATA[key].L;
  snapshot(key);
  setValue(L, el.dataset.p, cleanHtml(el));
  const next = OPS[name](L, ...a.slice(1), ...extra);
  const k = changed(key);
  return render(next ? { h: k, ...next } : null);
}
// A change made to the data directly (not through one piece): save, redraw, put the caret back.
function commit(key, next) {
  const k = changed(key);
  return render(next ? { h: k, ...next } : null);
}

// ---------- autosave ----------
// Drafts save to Firestore a moment after typing stops; lessons on the site
// save to GitHub after a slightly longer pause (each save is a commit).
// Only a failure is shown.
const DIRTY = new Set(), TIMERS = {}, CHAIN = {};
function changed(key) {
  if (key === NEW) key = promoteNew();
  DIRTY.add(key);
  clearTimeout(TIMERS[key]);
  TIMERS[key] = setTimeout(() => saveNow(key), isDraft(key) ? 1200 : 4000);
  if (isDraft(key)) updateDraftLabel(key);
  backup(key);
  return key;
}

// Every change is also kept in this browser until it's saved, so nothing
// typed is lost if a save fails or the page is closed first.
const BACKUP_KEY = "pshita.text.unsaved";
function readBackup() {
  let b = {};
  try { b = JSON.parse(localStorage.getItem(BACKUP_KEY)) || {}; } catch (e) {}
  // drafts kept by the previous version of this page
  try { Object.entries(JSON.parse(localStorage.getItem("pshita.text.drafts")) || {}).forEach(([id, v]) => { b["draft:" + id] = b["draft:" + id] || v; }); } catch (e) {}
  return b;
}
function writeBackup(b) {
  try { localStorage.setItem(BACKUP_KEY, JSON.stringify(b)); localStorage.removeItem("pshita.text.drafts"); } catch (e) {}
}
function backup(key) {
  const b = readBackup(), d = DATA[key];
  b[key] = d.draft ? { L: d.L, createdAt: d.createdAt } : { L: d.L, base: d.base };
  writeBackup(b);
}
function dropBackup(key) { const b = readBackup(); delete b[key]; writeBackup(b); }
// On opening the page: put back whatever wasn't saved last time, and save it.
// The lesson on the site (its source) has the same content as `L` would once saved.
const canon = (x) => JSON.stringify(x, (k, v) => (v && typeof v === "object" && !Array.isArray(v) ? Object.fromEntries(Object.keys(v).sort().map((n) => [n, v[n]])) : v));
function sameLesson(src, L) {
  try {
    const copy = JSON.parse(JSON.stringify(L));
    tidy(copy);
    return canon(JSON.parse(src)) === canon(copy);
  } catch (e) { return false; }
}
async function restoreBackups() {
  for (const [key, v] of Object.entries(readBackup())) {
    if (isDraft(key)) {
      if (!DATA[key]) DRAFTS.push({ id: key.slice(6), createdAt: v.createdAt });
      DATA[key] = { L: v.L, draft: true, createdAt: v.createdAt };
    } else {
      // a lesson: only if nobody changed it on the site since
      let src = null;
      try { src = (await httpsCallable(fns, "getLessonData")({ path: key })).data.src; } catch (e) {}
      if (src === null) continue;
      if (src !== v.base) {
        // already on the site (a save that went through but wasn't confirmed here): nothing to restore
        if (sameLesson(src, v.L)) { dropBackup(key); continue; }
        say(`יש במחשב הזה שינויים שלא נשמרו ב"${plain(v.L.title)}", אבל השיעור השתנה מאז באתר, אז הם לא הוחזרו.`);
        continue;
      }
      DATA[key] = { L: v.L, base: src };
    }
    DIRTY.add(key);
    TIMERS[key] = setTimeout(() => saveNow(key), 800);
  }
  DRAFTS.sort((a, b) => a.createdAt - b.createdAt);
}
function saveNow(key) {
  clearTimeout(TIMERS[key]);
  CHAIN[key] = (CHAIN[key] || Promise.resolve()).then(() => doSave(key));
  return CHAIN[key];
}
async function doSave(key) {
  if (!DIRTY.has(key)) return;
  DIRTY.delete(key);
  const d = DATA[key];
  let titleError = false;
  try {
    if (isDraft(key) && draftEmpty(d.L)) {
      // everything was deleted: the page goes too
      await fs.deleteDoc(fs.doc(auth.getDb(), "drafts", key.slice(6)));
      if (!DIRTY.has(key) && draftEmpty(d.L)) removeDraft(key);
      return;
    } else if (isDraft(key)) {
      await fs.setDoc(fs.doc(auth.getDb(), "drafts", key.slice(6)), {
        title: plain(d.L.title), data: JSON.stringify(d.L), createdAt: d.createdAt, updatedAt: Date.now(),
      });
    } else {
      const copy = JSON.parse(JSON.stringify(d.L));
      // an empty heading or a heading with no text yet: wait until it's filled
      if (tidy(copy)) { DIRTY.add(key); return; }
      const res = await httpsCallable(fns, "saveLessonData")({ path: key, lesson: copy, base: d.base });
      d.base = res.data.src;
      // saved, but the lesson list didn't take the new name (the next save tries again)
      titleError = Boolean(res.data.titleError);
    }
    // saved: drop the local copy, or refresh it if more was typed meanwhile
    if (DIRTY.has(key)) backup(key); else dropBackup(key);
    if (titleError) say("התוכן נשמר, אבל השם החדש לא עודכן ברשימת השיעורים. נסו לשנות אותו שוב.");
    else if (!DIRTY.size) say("");
  } catch (err) {
    DIRTY.add(key);
    const why = ((err && err.message) || "שגיאה").replace(/[.\s]+$/, "");
    say(`השמירה לא הצליחה: ${why}. השינויים שמורים במחשב הזה, וננסה שוב בשינוי הבא.`);
  }
}
// A draft with no text left at all (name, page line, headings, paragraphs, boxes).
const draftEmpty = (L) => !itemText([L.title, L.ref, L.stations, L.screens.map((x) => [x.text, x.before, x.after])]);
function removeDraft(key) {
  DRAFTS = DRAFTS.filter((x) => "draft:" + x.id !== key);
  delete DATA[key];
  dropBackup(key);
  DIRTY.delete(key);
  clearTimeout(TIMERS[key]);
  // it disappears from the page and from the menu; if the caret is still in it, an
  // unsaved empty page takes its place, so typing can go on
  const typing = CUR && CUR.dataset.h === key && SELECTED.includes(key);
  SELECTED = SELECTED.filter((k) => k !== key && (!typing || k !== NEW));
  if (typing) { DATA[NEW] = { L: newDraftData(), draft: true }; SELECTED.push(NEW); }
  saveSelection();
  drawMenus();
  render(typing ? { h: NEW, p: "tt" } : null);

// The empty "עמוד חדש" became a draft once something was typed in it.

page.addEventListener("beforeinput", (e) => {
  if (!EDIT) return;
  const t = e.inputType, s = getSelection();
  if (t === "historyUndo" || t === "historyRedo") { e.preventDefault(); return; }  // handled on keydown
  if (/Drop|Drag/.test(t)) { e.preventDefault(); return; }
  if (!s.rangeCount) return;
  const r = s.getRangeAt(0);
  let a = elOf(r.startContainer), b = elOf(r.endContainer);
  if (!a || !b) {
    // the selection starts or ends outside the text (e.g. Ctrl+A): trim it to the text inside
    const inside = [...page.querySelectorAll("[data-p]")].filter((el) => el.isContentEditable && r.intersectsNode(el));
    if (!inside.length) { e.preventDefault(); return; }
    if (!a) { a = inside[0]; r.setStart(a, 0); }

  }
  if (a !== b) {
    if (t.startsWith("format")) return;  // bold etc. across pieces is fine
    e.preventDefault();

    return;
  }

    if (kind === "tx") {
      // split at the caret, like a word processor
      r.deleteContents();
      const tail = document.createRange();
      tail.selectNodeContents(a);
      tail.setStart(r.startContainer, r.startOffset);
      const box = document.createElement("div");
      box.appendChild(tail.extractContents());
      runOp(a, "splitPara", cleanHtml(box));

    }
    if (kind === "st") runOp(a, "addParaInStation");
    else if (kind === "tt" || kind === "rf") runOp(a, "fromTitle");
    else if (BLOCK_PIECE.test(kind)) runOp(a, "blockEnter");

  }

  if (back && caretAt(a, false)) {

      else if (BLOCK_PIECE.test(kind)) runOp(a, "blockBack");

function pasteInto(el, text, html) {
  if (el.dataset.p.split(".")[0] !== "tx") {

  const blocks = html ? pastedBlocks(html)
    : text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((l) => ({ type: "p", html: escText(l) }));
  if (!blocks.length) return;
  if (blocks.length === 1 && blocks[0].type === "p") { document.execCommand("insertHTML", false, blocks[0].html); return; }

  const r = getSelection().getRangeAt(0);

const escText = (t) => t.replace(/\u00a0/g, " ").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const colorProbe = document.createElement("span");

  if (!c) return false;

  colorProbe.style.color = c;
  if (!colorProbe.style.color) return false;
  document.body.appendChild(colorProbe);
  const m = getComputedStyle(colorProbe).color.match(/\d+/g) || [];

  return r >= 140 && g <= 120 && b <= 120 && r - Math.max(g, b) >= 70;
}
// One pasted piece of text, keeping only bold, italic and red.
function pastedInline(n) {
  if (n.nodeType === 3) return escText(n.data);
  if (n.nodeType !== 1 || /^(STYLE|SCRIPT|META|TITLE)$/.test(n.tagName)) return "";
  if (n.tagName === "BR") return " ";
  let inner = [...n.childNodes].map(pastedInline).join("");
  if (!inner.trim()) return inner;

// Pasted HTML -> [{type:"p", html} | {type:"h", name}]

  const BLOCK = /^(P|DIV|LI|UL|OL|BLOCKQUOTE|TABLE|TBODY|TR|TD|TH|SECTION|ARTICLE|HEADER|FOOTER|PRE|DL|DT|DD)$/;
  const hasBlock = (n) => n.querySelector && n.querySelector("p,div,li,h1,h2,h3,h4,h5,h6,br,table");
  const walk = (node) => node.childNodes.forEach((n) => {
    if (n.nodeType === 3) { cur += escText(n.data); return; }
    if (n.nodeType !== 1 || /^(STYLE|SCRIPT|META|TITLE|HEAD)$/.test(n.tagName)) return;
    const t = n.tagName;
    if (/^H[1-6]$/.test(t) || /MsoTitle|MsoHeading|MsoSubtitle/i.test(n.className || "") || n.getAttribute("role") === "heading") {

      const name = n.textContent.replace(/\s+/g, " ").trim();
      if (name) out.push({ type: "h", name: escText(name) });
      return;
    }
    if (t === "BR") { flush(); return; }
    if (BLOCK.test(t)) { flush(); walk(n); flush(); return; }
    // an inline wrapper around whole paragraphs (Google Docs does this): look inside
    if (hasBlock(n)) { walk(n); return; }
    cur += pastedInline(n);

  flush();
  return out;
}

  if (row && b && b.dataset.mv) { moveSiteLesson(row, b.dataset.mv); return true; }
  if (row && b && b.hasAttribute("data-del")) { deleteSiteLesson(row); return true; }
  if (!nl) return false;
  const form = nl.querySelector(".nl-form");
  if (b && b.classList.contains("nl-toggle")) form.hidden = !form.hidden;
  else if (b && b.classList.contains("nl-cancel")) form.hidden = true;
  else if (b && b.classList.contains("nl-create")) createSiteLesson(nl);
  return true;
}
function sortSelected() {
  const order = menus().flatMap((g) => g.items.map((it) => it.key));
  SELECTED.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  saveSelection();
}
async function moveSiteLesson(row, direction) {
  const key = row.dataset.key;
  row.classList.add("busy");
  try {
    await httpsCallable(fns, "moveLesson")({ lessonId: idOfKey(key), direction });
    const g = GROUPS.find((x) => x.lessons.some((l) => l.key === key)), i = g.lessons.findIndex((l) => l.key === key), j = direction === "up" ? i - 1 : i + 1;
    [g.lessons[i], g.lessons[j]] = [g.lessons[j], g.lessons[i]];
    sortSelected();
    drawMenus();
    render();
  } catch (err) {
    row.classList.remove("busy");
    say((err && err.message) || "שינוי הסדר נכשל.");
  }
}
async function deleteSiteLesson(row) {
  const key = row.dataset.key, l = GROUPS.flatMap((g) => g.lessons).find((x) => x.key === key);
  if (!confirm('למחוק את השיעור "' + plain(l ? l.title : idOfKey(key)) + '"? הפעולה לא הפיכה.')) return;
  row.classList.add("busy");
  try {
    await httpsCallable(fns, "deleteLesson")({ lessonId: idOfKey(key) });
    GROUPS.forEach((g) => { g.lessons = g.lessons.filter((x) => x.key !== key); });
    SELECTED = SELECTED.filter((k) => k !== key);
    delete DATA[key];
    saveSelection();
    drawMenus();
    render();
  } catch (err) {
    row.classList.remove("busy");
    say((err && err.message) || "המחיקה נכשלה.");
  }
}
async function createSiteLesson(nl) {
  const status = nl.querySelector(".nl-status"), id = nl.querySelector(".nl-id").value.trim(), title = nl.querySelector(".nl-title").value.trim();
  if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(id)) { status.textContent = "מזהה לא תקין (אותיות אנגליות קטנות, ספרות ומקפים בלבד)."; return; }
  if (!title) { status.textContent = "צריך כותרת."; return; }
  const g = GROUPS.find((x) => x.name === nl.dataset.group), last = g && g.lessons[g.lessons.length - 1];
  status.textContent = "יוצר…";
  try {
    await httpsCallable(fns, "createLesson")({ lessonId: id, titleText: title, sourceText: nl.dataset.group, afterLessonId: last ? idOfKey(last.key) : null });
    // the new lesson, straight from the repository (the site takes a minute or two to show it)
    const key = `lessons/${id}.html`, src = (await httpsCallable(fns, "getLessonData")({ path: key })).data.src;
    DATA[key] = { L: JSON.parse(src), base: src };
    g.lessons.push({ key, title: DATA[key].L.title });
    SELECTED.push(key);
    sortSelected();
    drawMenus();
    render();
  } catch (err) {
    status.textContent = (err && err.message) || "יצירת השיעור נכשלה.";
  }
}

// First visit: the first lesson; after that, whatever was open last time.
function defaultSelection() {
  const first = GROUPS[0] && GROUPS[0].lessons[0];
  return first ? [first.key] : [];
}
const indexReady = loadIndex();
indexReady.then(() => {
  if (isAdmin) return;
  SELECTED = (loadSelection() || defaultSelection()).filter((k) => !isDraft(k));
  drawMenus();
  render();
}).catch(() => { $("page").innerHTML = '<p class="empty">לא הצלחתי לטעון את רשימת השיעורים.</p>'; });
</script>
