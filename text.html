<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טקסט | פשיטא</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@400;600&family=Rubik:wght@400;600;700&display=swap">
<style>
/* plain continuous text of the lessons, like a word-processor page */
:root{--ink:#111;--muted:#666;--line:#ddd;--desk:#e9e9ec;--page:#fff;--accent:#1a5fb4;--edit:#fff8d6;--text:'Frank Ruhl Libre',David,'Times New Roman',serif}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:Arial,'Segoe UI',sans-serif}
/* the top bar hides; a click on the strip at the top of the screen brings it back */
#hot{position:fixed;top:0;left:0;right:0;height:14px;z-index:2;cursor:pointer}
#hot::after{content:"";position:absolute;top:4px;left:50%;width:48px;height:4px;margin-left:-24px;border-radius:2px;background:#c4c4c8}
/* bar and menus: same look as the site header and its menu (assets/css/style.css) */
:root{--s-bg:#faf6ee;--s-ink:#2b241b;--s-soft:#5c5347;--s-line:#e4d9c4;--s-accent-soft:#f1e3d1;--s-accent-strong:#6d3a22;--s-head:"Rubik","Heebo","Arial Hebrew",sans-serif}
.bar{position:fixed;top:0;left:0;right:0;z-index:3;transform:translateY(-100%);transition:transform .18s;background:#fff;border-bottom:1px solid var(--s-line);box-shadow:0 2px 10px rgba(43,36,27,.08);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--s-head);color:var(--s-ink)}
.bar.show{transform:none}
.bar button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
.brand{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:700;line-height:1.2}
.brand .mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--s-accent-soft);color:var(--s-accent-strong);font-size:1.1rem}
.bar .view{display:flex;align-items:center;gap:6px;font-size:.95rem;padding:8px 10px;border-radius:8px}
.bar .view:hover,.bar .view.open{background:var(--s-accent-soft);color:var(--s-accent-strong)}
.chev{width:16px;height:16px;flex:none;transition:transform .2s}
.view.open .chev,.sec.open>.sec-h .chev{transform:rotate(180deg)}
.panel{position:fixed;z-index:4;min-width:220px;max-width:calc(100vw - 16px);max-height:min(430px,calc(100vh - 90px));overflow-y:auto;background:#fff;border:1px solid var(--s-line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:10px;display:flex;flex-direction:column;gap:6px;font-family:var(--s-head);color:var(--s-ink);line-height:1.75}
.panel *{flex-shrink:0}
.panel[hidden]{display:none}
.panel a,.panel label,.sec-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--s-ink);text-decoration:none;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.panel a:hover,.panel label:hover,.sec-h:hover{background:var(--s-accent-soft);color:var(--s-accent-strong)}
.sec-h{width:100%;justify-content:space-between;border:0;background:none;font-family:"Heebo","Arial Hebrew",sans-serif;line-height:normal;text-align:start}
.sec-b{margin:4px 0 0;padding:6px;border:1px solid var(--s-line);border-radius:8px;background:var(--s-bg);display:flex;flex-direction:column;gap:2px}
.sec:not(.open) .sec-b{display:none}
.sec-b a,.sec-b label{font-size:.88rem}
.panel label.new{color:var(--s-soft)}
.panel .opt{border-bottom:1px solid var(--s-line);border-radius:8px 8px 0 0;padding-bottom:10px}
.panel .acct{border-top:1px solid var(--s-line);padding-top:10px;margin-top:4px;display:flex;flex-direction:column;gap:6px}
.panel a.login{align-self:flex-start;background:#8a4b2e;color:#fff;font-size:.9rem;padding:7px 16px;border-radius:999px}
.panel a.login:hover{background:#8a4b2e;color:#fff;opacity:.9}
.panel a.textlink{border-top:1px solid var(--s-line);border-radius:0 0 8px 8px;margin-top:4px;padding-top:10px}
.hello{font-family:"Heebo","Arial Hebrew",sans-serif;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px}
.hello span{font-size:.85rem;color:var(--s-soft);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hello button{flex:none;font:inherit;line-height:1.75;font-size:.8rem;color:var(--s-soft);background:none;border:1px solid var(--s-line);border-radius:999px;padding:3px 10px;cursor:pointer}
.hello button:hover{color:var(--s-accent-strong);border-color:currentColor}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;max-width:calc(100vw - 32px);background:#b00020;color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#msg:empty{display:none}
/* bold / red on selected text */
/* search and replace, over every page shown */
.tools{display:flex;align-items:center;gap:6px}
.bar .icon{padding:8px}
.zoom{display:flex}
.zoom button{font-weight:700;padding:8px 9px}
.zoom #zoomOut{font-size:.85rem}
.zoom #zoomIn{font-size:1.05rem}
.bar .icon svg{width:20px;height:20px;display:block}
#find{position:fixed;top:10px;left:16px;z-index:6;background:#fff;border:1px solid var(--s-line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px;display:flex;flex-direction:column;gap:6px;font-family:var(--s-head);font-size:14px;max-width:calc(100vw - 32px)}
#find[hidden]{display:none}
#find .frow{display:flex;align-items:center;gap:4px}
#find input{font:inherit;width:190px;max-width:52vw;padding:6px 10px;border:1px solid var(--s-line);border-radius:8px;outline:none}
#find input:focus{border-color:#8a4b2e}
#find button{font:inherit;border:0;background:none;padding:5px 8px;border-radius:7px;cursor:pointer;color:var(--s-ink);white-space:nowrap}
#find button:hover{background:var(--s-accent-soft);color:var(--s-accent-strong)}
#findN{color:var(--s-soft);font-size:12px;min-width:44px;text-align:center}
::highlight(hits){background:#ffe58a}
::highlight(hit-now){background:#f0a33c;color:#000}
#fmt{position:absolute;z-index:4;display:flex;gap:2px;background:#222;border-radius:7px;padding:3px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#fmt[hidden]{display:none}
#fmt button{width:30px;height:28px;border:0;border-radius:5px;background:none;color:#fff;font:700 15px Arial,sans-serif;cursor:pointer}
#fmt button:hover{background:#444}
#fmt .red{color:#ff8a7a}
#fmt .hd{width:auto;padding:0 8px;font-size:13px;border-inline-start:1px solid #555;border-radius:0 5px 5px 0}
.page{max-width:820px;margin:0 auto 40px;background:var(--page);box-shadow:0 1px 4px rgba(0,0,0,.15);padding:56px 64px;font-family:var(--text);font-size:var(--fs,17px);line-height:1.5}
.page h1{font-size:1.47em;font-weight:700;margin:0 0 2px}
.page h1:not(:first-child){margin-top:40px;padding-top:26px;border-top:1px solid var(--line)}
.page .ref{color:var(--muted);font-size:.82em;margin:0 0 14px}
.page h2{font-size:1.12em;font-weight:700;margin:20px 0 4px}
.page p{margin:0 0 6px;text-align:justify}
.page .q{margin:10px 0 2px;font-weight:700}
.page ol{list-style-type:hebrew;margin:0 0 8px;padding-inline-start:28px}
.page li.ok{font-weight:700}
.page li.ok::after{content:" ✓"}
.page table{border-collapse:collapse;margin:8px 0 12px;font-size:.88em}
.page td,.page th{border:1px solid #999;padding:3px 8px}
.page .note{color:var(--muted);font-size:14px;font-family:Arial,sans-serif}
.empty{color:var(--muted)}
.page [data-ph]:empty::before{content:attr(data-ph);color:#aaa}
/* edit mode (double-click any text, admin only) */
.editing [contenteditable]{outline:none;border-radius:3px;transition:background .15s}
.editing [contenteditable]:hover{background:#f6f6f6}
.editing [contenteditable]:focus{background:var(--edit)}
#tb{position:absolute;z-index:2;font:13px Arial,sans-serif}
#tb[hidden]{display:none}
#tb button{font:inherit;padding:3px 10px;border:1px solid #bbb;border-radius:5px;background:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (max-width:640px){.page{padding:28px 18px;font-size:var(--fs,16px)}}
@media print{.bar,.panel,#tb,#hot,#fmt,#msg,#find{display:none}body{background:#fff}.page{box-shadow:none;margin:0;max-width:none;padding:0}}
</style>
</head>
<body>
<div id="hot" title="תפריט"></div>
<div class="bar" id="bar">
  <button type="button" class="brand" id="siteBtn"><span class="mark">📖</span><span>פשיטא</span></button>
  <span class="tools">
  <span class="zoom"><button type="button" class="view" id="zoomOut" title="הקטנת הטקסט">א-</button><button type="button" class="view" id="zoomIn" title="הגדלת הטקסט">א+</button></span>
  <button type="button" class="view icon" id="findBtn" title="חיפוש והחלפה"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  <button type="button" class="view" id="viewBtn">תצוגה <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </span>
</div>
<div id="msg"></div>
<div id="find" hidden>
  <div class="frow"><input type="search" id="findQ" placeholder="חיפוש" autocomplete="off"><span id="findN"></span>
    <button type="button" id="findPrev" title="הקודם">▲</button><button type="button" id="findNext" title="הבא">▼</button><button type="button" id="findX" title="סגירה">✕</button></div>
  <div class="frow" id="replRow" hidden><input type="text" id="replQ" placeholder="החלפה ב…" autocomplete="off">
    <button type="button" id="replOne">החלפה</button><button type="button" id="replAll">החלפת הכול</button></div>
</div>
<div id="fmt" hidden><button type="button" data-cmd="bold" title="מודגש">B</button><button type="button" data-cmd="red" class="red" title="אדום">A</button><button type="button" data-cmd="heading" class="hd" title="להפוך לכותרת">כותרת</button></div>
<div class="page" id="page"><p class="empty">טוען…</p></div>
<div id="panels"></div>
<div id="tb" hidden></div>

<script type="module">
// Pages shown here, by key:
//   "lessons/<id>.html" - a lesson on the site (content in lessons/data/<id>.json, saved to GitHub)
//   "draft:<id>"        - a lesson being written, not on the site yet (Firestore, admin only)
//   "draft:new"         - the empty page at the end of the "עריכה" menu; typing in it makes it a draft
// Firebase is loaded only for the admin, so reading never depends on it.
let auth = null, httpsCallable = null, fns = null, fs = null, isAdmin = false;

const ADMIN_EMAIL = "ufd5a4a70e876fc8672e3d112e6866c55@arba-avot-users.local";
const SEL_KEY = "pshita.text.selected";
const NEW = "draft:new";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const isDraft = (key) => key.startsWith("draft:");
let GROUPS = [], DRAFTS = [], DATA = {}, EDIT = false;
let SELECTED = [];

// ---------- loading ----------
async function loadIndex() {
  const site = await (await fetch("lessons.json", { cache: "no-cache" })).json();
  GROUPS = site.groups.map((g) => ({ name: g.title, lessons: g.lessons.map((l) => ({ key: `lessons/${l.id}.html`, title: l.title })) }));
}

const dataUrl = (href) => href.replace(/^lessons\/([^/]+)\.html$/, "lessons/data/$1.json");
const newDraftData = () => ({ title: "", ref: "", stations: [""], screens: [{ type: "read", st: 0, text: [""] }] });

async function loadLesson(href) {
  const r = await fetch(dataUrl(href), { cache: "no-cache" });
  if (!r.ok) throw new Error(r.status);
  return { L: await r.json() };
}

// For editing, read the lesson straight from the repository (the site
// itself can lag a few minutes behind a save) and remember that exact
// source, so the server can refuse to overwrite a newer version.
async function loadForEdit(href) {
  const d = DATA[href];
  if (d && d.base) return;
  try {
    const res = await httpsCallable(fns, "getLessonData")({ path: href });
    DATA[href] = { L: JSON.parse(res.data.src), base: res.data.src };
  } catch (e) {
    if (!d) DATA[href] = await loadLesson(href).catch(() => null);
    if (DATA[href]) DATA[href].noEdit = true;
  }
}

async function loadDrafts() {
  const snap = await fs.getDocs(fs.collection(auth.getDb(), "drafts"));
  DRAFTS = [];
  snap.forEach((doc) => {
    const v = doc.data();
    let L;
    try { L = JSON.parse(v.data); } catch (e) { return; }
    DRAFTS.push({ id: doc.id, createdAt: v.createdAt || 0 });
    DATA["draft:" + doc.id] = { L, draft: true, createdAt: v.createdAt || 0 };
  });
  DRAFTS.sort((a, b) => a.createdAt - b.createdAt);
  DATA[NEW] = { L: newDraftData(), draft: true };
}

// ---------- rendering ----------
// Text keeps only bold, italic and red; every other tag or attribute (colors
// from the lesson design, formatting pasted from elsewhere) is dropped.
const RED = '<span style="color:#B5432A">';
const isRedEl = (n) => n.style.color === "rgb(181, 67, 42)" || (n.getAttribute("color") || "").toLowerCase() === "#b5432a";
function ser(node, keepColor = true) {
  let out = "";
  node.childNodes.forEach((n) => {
    if (n.nodeType === 3) { out += n.textContent.replace(/\u00a0/g, " ").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); return; }
    if (n.nodeType !== 1) return;
    const t = n.tagName, inner = ser(n, keepColor);
    if (t === "BR") out += " ";
    else if (!inner) return;
    else if (keepColor && (t === "B" || t === "STRONG") && n.style.color && !isRedEl(n)) out += `<b style="color:${n.style.color}">${inner}</b>`;  // the lesson's colored key words
    else if (t === "B" || t === "STRONG" || (t === "SPAN" && /^(bold|[6-9]00)$/.test(n.style.fontWeight))) out += `<${t === "STRONG" ? "strong" : "b"}>${inner}</${t === "STRONG" ? "strong" : "b"}>`;
    else if (t === "I" || t === "EM") out += `<i>${inner}</i>`;
    else if ((t === "SPAN" || t === "FONT") && isRedEl(n)) out += `${RED}${inner}</span>`;
    else out += inner;
  });
  return out;
}
const tpl = document.createElement("template");
// for reading: the design's colored key words show as plain bold (saving keeps them)
const clean = (s) => { tpl.innerHTML = String(s); return ser(tpl.content, false); };
const plain = (s) => { tpl.innerHTML = String(s); return tpl.content.textContent.trim(); };

// Every editable piece carries its place in the lesson data (data-p), so a
// double-click can find it again once edit mode is on.
function renderLesson(key, d, q) {
  const L = d.L, editable = EDIT && (d.draft || (!d.noEdit && d.base));
  const ed = (p, v, ph = "") => ` data-h="${esc(key)}" data-p="${p}" data-ph="${esc(ph)}"` + (editable ? ` contenteditable="true">${v}` : `>${clean(v)}`);
  let h = d.draft ? `<h1${ed("tt", L.title, "שם השיעור")}</h1>` : `<h1>${clean(L.title)}</h1><p class="ref">${esc(L.ref || "")}</p>`;
  if (EDIT && !editable) h += `<p class="note">את השיעור הזה אי אפשר לערוך מכאן.</p>`;
  let last = -1;
  L.screens.forEach((s, si) => {
    const shown = s.type === "read" || (q && !["intro", "summary"].includes(s.type));
    if (shown && s.st !== undefined && s.st !== last && L.stations[s.st] !== undefined) {
      h += `<h2${ed("st." + s.st, L.stations[s.st], "כותרת")}</h2>`; last = s.st;
    }
    if (s.type === "intro") { if (s.question) h += `<p${ed("iq." + si, s.question)}</p>`; return; }
    if (s.type === "read") {
      if (s.kicker) h += `<p><b${ed("kk." + si, s.kicker)}</b></p>`;
      (s.comic || []).forEach((p) => h += `<p>${clean(p[1])}</p>`);
      (s.text || []).forEach((t, ti) => h += `<p${ed(`tx.${si}.${ti}`, t, "טקסט")}</p>`);
      if (s.quote) h += `<p>${clean(s.quote)}</p>`;
      ["before", "after"].forEach((side) => (s[side] || []).forEach((b, bi) => {
        if (b.k === "gloss") b.items.forEach((g, gi) => h += `<p${ed(`gl.${si}.${side}.${bi}.${gi}`, g)}</p>`);
        else if (b.k === "short") h += `<p><b>בקיצור:</b> <span${ed(`sh.${si}.${side}.${bi}`, b.text)}</span></p>`;
        else if (b.k === "cards") h += `<p>${b.items.map((c, ci) => `<b${ed(`ct.${si}.${side}.${bi}.${ci}`, c.t)}</b>: <span${ed(`cs.${si}.${side}.${bi}.${ci}`, c.s)}</span>`).join(" · ")}</p>`;
      }));
      return;
    }
    if (s.type === "summary") {
      const t = s.table, cell = (c) => (c && c.v !== undefined ? c.v : c);
      if (t) h += `<h2>סיכום</h2><table><tr>${t.cols.map((c, ci) => `<th${ed(`tc.${si}.${ci}`, c)}</th>`).join("")}</tr>${t.rows.map((r, ri) => `<tr>${r.map((c, ci) => `<td${ed(`tr.${si}.${ri}.${ci}`, cell(c))}</td>`).join("")}</tr>`).join("")}</table>`;
      return;
    }
    if (!q) return;
    const opts = (list, a) => `<ol>${list.map((x, i) => `<li class="${i === a ? "ok" : ""}"${ed(`o.${si}.${i}`, x)}</li>`).join("")}</ol>`;
    if (s.type === "mc") h += `<p class="q"${ed("q." + si, s.q)}</p>` + opts(s.o, s.a);
    else if (s.type === "fill") h += `<p class="q">${clean(s.before)} ___ ${clean(s.after)}</p>` + opts(s.o, s.a);
    else if (s.type === "judge") h += `<p class="q">${s.sides.map((x) => clean(x[0] + ": " + x[1])).join(" / ")}</p>` + opts(s.o, s.a);
    else if (s.type === "tf") h += `<p class="q">נכון או לא נכון: <span${ed("tf." + si, s.s)}</span></p><p>${s.a ? "נכון" : "לא נכון"}</p>`;
    else if (s.q) h += `<p class="q">${clean(s.q)}</p>` + (s.ans ? `<p>${clean(s.ans)}</p>` : "");
  });
  return h;
}

async function render(focus) {
  const list = SELECTED.filter((k) => !isDraft(k) || DATA[k]);
  if (!list.length) { $("page").innerHTML = '<p class="empty">בחרו שיעור בתפריט למעלה.</p>'; return; }
  await Promise.all(list.map(async (key) => {
    if (isDraft(key)) return;
    if (EDIT) await loadForEdit(key);
    else if (!DATA[key]) DATA[key] = await loadLesson(key).catch(() => null);
  }));
  $("page").classList.toggle("editing", EDIT);
  $("page").innerHTML = list.map((k) => {
    const d = DATA[k];
    return d ? renderLesson(k, d, SHOWQ) : `<p class="empty">לא נטען: ${esc(k)}</p>`;
  }).join("");
  hideTb();
  if (!$("find").hidden) runFind(false);
  if (focus) {
    const el = document.querySelector(`[data-h="${CSS.escape(focus.h)}"][data-p="${focus.p}"]`);
    if (el && el.isContentEditable) {
      el.focus();
      if (focus.point) placeCaretAtPoint(el, focus.point); else placeCaret(el, focus.start);
      showTb(el);
    }
  }
}

// ---------- "תצוגה": one menu, a section per page/amud, plus "עריכה" for the admin ----------
const draftTitle = (key) => plain(DATA[key].L.title) || "ללא שם";
const OPEN = new Set(["עריכה"]);
function menus() {
  const m = GROUPS.map((g) => ({ name: g.name, items: g.lessons.map((l) => ({ key: l.key, title: l.title })) }));
  if (isAdmin) m.push({ name: "עריכה", items: [...DRAFTS.map((d) => ({ key: "draft:" + d.id, title: draftTitle("draft:" + d.id) })), { key: NEW, title: "עמוד חדש", cls: "new" }] });
  return m;
}
let SHOWQ = false, USER = null;  // questions hidden unless "שאלות" is ticked
const CHEV = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// a collapsible section; `key` remembers whether it's open
const secHtml = (key, label, body) => `<div class="sec${OPEN.has(key) ? " open" : ""}" data-name="${esc(key)}">
    <button type="button" class="sec-h"><span>${esc(label)}</span>${CHEV}</button><div class="sec-b">${body}</div></div>`;
function drawMenus() {
  const open = ["sitePanel", "viewPanel"].find((id) => $(id) && !$(id).hidden), scroll = open ? $(open).scrollTop : 0;
  // the site menu, as on every page: lessons by page/amud, then the account
  const site = GROUPS.map((g) => secHtml("site:" + g.name, g.name, g.lessons.map((l) => `<a href="${esc(l.key)}">${esc(plain(l.title))}</a>`).join(""))).join("");

// ---------- search and replace ----------
// Matches are found in the text of every page shown and marked with the CSS
// Highlight API, so the page itself isn't touched. Replacing changes the
// lesson data (like typing) and saves the usual way; text outside the lesson
// data (summaries, tables) can be found but not replaced.
const BLOCKS = "h1,h2,p,li,td,th";
let HITS = [], NOW = -1;
function findAll(q) {
  const hits = [];
  if (!q) return hits;
  $("page").querySelectorAll(BLOCKS).forEach((block) => {
    if (block.querySelector(BLOCKS)) return;
    const nodes = [], walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
    let text = "", n;
    while ((n = walker.nextNode())) { nodes.push([n, text.length]); text += n.data; }
    const at = (i) => { let k = nodes.length - 1; while (k > 0 && nodes[k][1] > i) k--; return [nodes[k][0], i - nodes[k][1]]; };
    for (let i = text.indexOf(q); i > -1; i = text.indexOf(q, i + q.length)) {
      const r = document.createRange();
      r.setStart(...at(i));
      const [en, eo] = at(i + q.length - 1);
      r.setEnd(en, eo + 1);
      const host = r.startContainer.parentElement.closest("[data-p]");
      hits.push({ r, block, el: host && host.contains(r.endContainer) && block.contains(host) ? host : null });
    }
  });
  return hits;
}
function paintHits() {
  if (!window.Highlight || !CSS.highlights) return;
  CSS.highlights.set("hits", new Highlight(...HITS.map((h) => h.r)));
  CSS.highlights.set("hit-now", NOW > -1 ? new Highlight(HITS[NOW].r) : new Highlight());
}
function showHit(scroll = true) {
  $("findN").textContent = HITS.length ? `${NOW + 1}/${HITS.length}` : ($("findQ").value ? "0" : "");
  paintHits();
  if (NOW < 0 || !scroll) return;
  const rect = HITS[NOW].r.getBoundingClientRect();
  if (rect.top < 60 || rect.bottom > innerHeight - 20) scrollBy({ top: rect.top - innerHeight / 3, behavior: "smooth" });
}
// Re-run the search (after typing in it, a render, or a replace); keep about the same place.
function runFind(scroll = true) {
  const keep = NOW;
  HITS = findAll($("findQ").value);
  NOW = HITS.length ? Math.min(Math.max(keep, 0), HITS.length - 1) : -1;
  showHit(scroll);
}
function step(d) {
  if (!HITS.length) return;
  NOW = (NOW + d + HITS.length) % HITS.length;
  showHit();
}
function openFind() {
  $("find").hidden = false;
  $("replRow").hidden = !isAdmin;
  const sel = String(getSelection()).trim();
  if (sel && sel.length < 80 && !sel.includes("\n")) $("findQ").value = sel;
  $("findQ").focus(); $("findQ").select();

}
function closeFind() {
  $("find").hidden = true;
  HITS = []; NOW = -1;
  if (window.Highlight && CSS.highlights) { CSS.highlights.delete("hits"); CSS.highlights.delete("hit-now"); }
}
// Replace the given hits (last first, so earlier ranges stay valid) and save each changed piece.
async function replaceHits(list) {
  if (!EDIT) { EDIT = true; await render(); runFind(false); list = list === "now" ? [HITS[NOW]] : HITS; }
  else if (list === "now") list = [HITS[NOW]];
  else if (list === "all") list = HITS;
  const to = $("replQ").value, touched = new Set();
  let skipped = 0;
  [...list].reverse().forEach((h) => {
    if (!h || !h.el || !h.el.isContentEditable) { skipped++; return; }
    h.r.deleteContents();
    if (to) h.r.insertNode(document.createTextNode(to));
    touched.add(h.el);
  });
  touched.forEach((el) => { setValue(DATA[el.dataset.h].L, el.dataset.p, cleanHtml(el)); changed(el.dataset.h); });
  if (skipped) say(`${skipped} מקומות לא הוחלפו, כי אי אפשר לערוך אותם מכאן.`);
  runFind(false);
}

const cleanHtml = (el) => ser(el).replace(/\s+/g, " ").trim();

// Bold / red bubble over selected text while editing.
const fmt = $("fmt");

// Selected text inside one paragraph -> the text before it, the selection, the text after it.

function selectionParts(el) {
  const s = getSelection();
  if (!s.rangeCount || el.dataset.p.split(".")[0] !== "tx") return null;

  if (!el.contains(r.startContainer) || !el.contains(r.endContainer)) return null;

  const name = plain(part([r.startContainer, r.startOffset], [r.endContainer, r.endOffset]));

  const before = part(null, [r.startContainer, r.startOffset]), after = part([r.endContainer, r.endOffset], null);
  const [, si, ti] = el.dataset.p.split(".").map(Number), L = DATA[el.dataset.h].L, S = L.screens[si];

function placeCaret(el, start) {

function setValue(L, p, v) {
  const a = p.split(".");
  const n = (i) => +a[i];
  switch (a[0]) {
    case "tt": L.title = v; break;
    case "st": L.stations[n(1)] = v; break;
    case "kk": L.screens[n(1)].kicker = v; break;
    case "tx": L.screens[n(1)].text[n(2)] = v; break;
    case "gl": L.screens[n(1)][a[2]][n(3)].items[n(4)] = v; break;
    case "q": L.screens[n(1)].q = v; break;
    case "o": L.screens[n(1)].o[n(2)] = v; break;
    case "tf": L.screens[n(1)].s = v; break;
    case "iq": L.screens[n(1)].question = v; break;
    case "sh": L.screens[n(1)][a[2]][n(3)].text = v; break;
    case "ct": L.screens[n(1)][a[2]][n(3)].items[n(4)].t = v; break;
    case "cs": L.screens[n(1)][a[2]][n(3)].items[n(4)].s = v; break;
    case "tc": L.screens[n(1)].table.cols[n(2)] = v; break;
    case "tr": {
      const row = L.screens[n(1)].table.rows[n(2)], c = row[n(3)];
      if (c && typeof c === "object") c.v = v; else row[n(3)] = v;
      break;
    }

// Where a new screen for station k goes: before the first screen of a later station (or the summary).
function stationEnd(L, k) {
  const i = L.screens.findIndex((s) => s.type === "summary" || (s.st !== undefined && s.st > k));
  return i === -1 ? L.screens.length : i;
}

function dropStationIfEmpty(L, k) {
  if (L.screens.some((s) => s.st === k)) return;
  L.stations.splice(k, 1);
  L.screens.forEach((s) => { if (s.st !== undefined && s.st > k) s.st--; });
}

const emptyScreen = (S) => !S.text.length && !(S.before || []).length && !(S.after || []).length && !S.comic && !S.quote && !S.kicker;

const OPS = {
  // Enter in a paragraph: whatever follows the caret becomes a new paragraph after it
  splitPara(L, si, ti, rest) { L.screens[si].text.splice(ti + 1, 0, rest); return { p: `tx.${si}.${ti + 1}`, start: true }; },
  // Enter in a heading: a new paragraph at the top of its section
  addParaInStation(L, k) {
    const si = L.screens.findIndex((s) => s.type === "read" && s.st === k);
    if (si > -1) {
      // reuse an empty first paragraph instead of adding another
      const t = L.screens[si].text;
      if (!t.length || plain(t[0])) t.unshift("");
      return { p: `tx.${si}.0` };
    }
    const at = L.screens.findIndex((s) => s.st === k);
    const pos = at > -1 ? at : stationEnd(L, k);
    L.screens.splice(pos, 0, { type: "read", st: k, text: [""] });
    return { p: `tx.${pos}.0` };
  },
  // Enter in the title: to the first heading
  fromTitle() { return { p: "st.0" }; },
  // An empty paragraph becomes a heading; what follows it in the section moves under the new heading.
  paraToHeading(L, si, ti) {
    const S = L.screens[si], k = S.st;
    S.text.splice(ti, 1);
    const rest = S.text.splice(ti);
    L.screens.forEach((s, j) => {
      if (s.st === undefined || s.type === "summary") return;
      if (s.st > k) s.st++;
      else if (s.st === k && j > si) s.st = k + 1;
    });
    L.stations.splice(k + 1, 0, "");
    const N = { type: "read", st: k + 1, text: rest.length ? rest : [""] };
    if (rest.length && S.after) { N.after = S.after; delete S.after; }
    L.screens.splice(si + 1, 0, N);
    if (emptyScreen(S)) L.screens.splice(si, 1);
    return { p: `st.${k + 1}` };
  },
  // Selected text becomes a heading: the paragraph splits around it, and what
  // follows (the rest of the paragraph and of the section) goes under the new heading.
  toHeading(L, si, ti, before, name, after) {
    const S = L.screens[si], k = S.st;
    const rest = S.text.splice(ti + 1);
    if (plain(after)) rest.unshift(after);
    if (plain(before)) S.text[ti] = before; else S.text.splice(ti, 1);
    L.screens.forEach((s, j) => {
      if (s.st === undefined || s.type === "summary") return;
      if (s.st > k) s.st++;
      else if (s.st === k && j > si) s.st = k + 1;
    });
    L.stations.splice(k + 1, 0, name);
    const N = { type: "read", st: k + 1, text: rest.length ? rest : [""] };
    if (rest.length && S.after) { N.after = S.after; delete S.after; }
    L.screens.splice(si + 1, 0, N);
    if (emptyScreen(S)) L.screens.splice(si, 1);
    return { p: `tx.${L.screens.indexOf(N)}.0`, start: true };
  },
  // Backspace in an empty paragraph
  delPara(L, si, ti) {
    const S = L.screens[si];
    S.text.splice(ti, 1);
    const prev = ti > 0 ? { p: `tx.${si}.${ti - 1}` } : null;
    if (emptyScreen(S)) {
      L.screens.splice(si, 1);
      dropStationIfEmpty(L, S.st);
    }
    return prev;
  },
  // Backspace in an empty heading: its section joins the one before it
  delHeading(L, k) {
    if (k === 0) return null;
    L.screens.forEach((s) => { if (s.st !== undefined && s.type !== "summary" && s.st >= k) s.st--; });
    L.stations.splice(k, 1);
    return { p: `st.${k - 1}` };
  },
};

function runOp(el, name, ...extra) {
  const key = el.dataset.h, a = el.dataset.p.split(".").map((x) => isNaN(x) ? x : +x);
  const L = DATA[key].L;
  setValue(L, el.dataset.p, cleanHtml(el));
  const next = OPS[name](L, ...a.slice(1), ...extra);
  changed(key);
  render(next ? { h: el.dataset.h, ...next } : null);
}

// ---------- autosave ----------
// Drafts save to Firestore a moment after typing stops; lessons on the site
// save to GitHub after a slightly longer pause (each save is a commit).
// Only a failure is shown.
const DIRTY = new Set(), TIMERS = {}, CHAIN = {};
function changed(key) {
  if (key === NEW) key = promoteNew();
  DIRTY.add(key);
  clearTimeout(TIMERS[key]);
  TIMERS[key] = setTimeout(() => saveNow(key), isDraft(key) ? 1200 : 4000);
  if (isDraft(key)) updateDraftLabel(key);
  backup(key);
}

// Every change is also kept in this browser until it's saved, so nothing
// typed is lost if a save fails or the page is closed first.
const BACKUP_KEY = "pshita.text.unsaved";
function readBackup() {
  let b = {};
  try { b = JSON.parse(localStorage.getItem(BACKUP_KEY)) || {}; } catch (e) {}
  // drafts kept by the previous version of this page
  try { Object.entries(JSON.parse(localStorage.getItem("pshita.text.drafts")) || {}).forEach(([id, v]) => { b["draft:" + id] = b["draft:" + id] || v; }); } catch (e) {}
  return b;
}
function writeBackup(b) {
  try { localStorage.setItem(BACKUP_KEY, JSON.stringify(b)); localStorage.removeItem("pshita.text.drafts"); } catch (e) {}
}
function backup(key) {
  const b = readBackup(), d = DATA[key];
  b[key] = d.draft ? { L: d.L, createdAt: d.createdAt } : { L: d.L, base: d.base };
  writeBackup(b);
}
function dropBackup(key) { const b = readBackup(); delete b[key]; writeBackup(b); }
// On opening the page: put back whatever wasn't saved last time, and save it.
async function restoreBackups() {
  for (const [key, v] of Object.entries(readBackup())) {
    if (isDraft(key)) {
      if (!DATA[key]) DRAFTS.push({ id: key.slice(6), createdAt: v.createdAt });
      DATA[key] = { L: v.L, draft: true, createdAt: v.createdAt };
    } else {
      // a lesson: only if nobody changed it on the site since
      let src = null;
      try { src = (await httpsCallable(fns, "getLessonData")({ path: key })).data.src; } catch (e) {}
      if (src === null) continue;
      if (src !== v.base) {
        say(`יש במחשב הזה שינויים שלא נשמרו ב"${plain(v.L.title)}", אבל השיעור השתנה מאז באתר, אז הם לא הוחזרו.`);
        continue;
      }
      DATA[key] = { L: v.L, base: src };
    }
    DIRTY.add(key);
    TIMERS[key] = setTimeout(() => saveNow(key), 800);
  }
  DRAFTS.sort((a, b) => a.createdAt - b.createdAt);
}
function saveNow(key) {
  clearTimeout(TIMERS[key]);
  CHAIN[key] = (CHAIN[key] || Promise.resolve()).then(() => doSave(key));
  return CHAIN[key];
}
async function doSave(key) {
  if (!DIRTY.has(key)) return;
  DIRTY.delete(key);
  const d = DATA[key];
  try {
    if (isDraft(key)) {
      await fs.setDoc(fs.doc(auth.getDb(), "drafts", key.slice(6)), {
        title: plain(d.L.title), data: JSON.stringify(d.L), createdAt: d.createdAt, updatedAt: Date.now(),
      });
    } else {
      const copy = JSON.parse(JSON.stringify(d.L));
      // an empty heading or a heading with no text yet: wait until it's filled
      if (tidy(copy)) { DIRTY.add(key); return; }
      const res = await httpsCallable(fns, "saveLessonData")({ path: key, lesson: copy, base: d.base });
      d.base = res.data.src;
    }
    // saved: drop the local copy, or refresh it if more was typed meanwhile
    if (DIRTY.has(key)) backup(key); else dropBackup(key);
    if (!DIRTY.size) say("");
  } catch (err) {
    DIRTY.add(key);
    const why = ((err && err.message) || "שגיאה").replace(/[.\s]+$/, "");
    say(`השמירה לא הצליחה: ${why}. השינויים שמורים במחשב הזה, וננסה שוב בשינוי הבא.`);
  }
}
// The empty "עמוד חדש" became a draft once something was typed in it.
function promoteNew() {
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const key = "draft:" + id;
  DATA[key] = { ...DATA[NEW], createdAt: Date.now() };
  DATA[NEW] = { L: newDraftData(), draft: true };
  DRAFTS.push({ id, createdAt: DATA[key].createdAt });
  document.querySelectorAll(`[data-h="${NEW}"]`).forEach((el) => el.dataset.h = key);
  SELECTED = SELECTED.map((k) => (k === NEW ? key : k));
  saveSelection();
  drawMenus();
  return key;
}
function updateDraftLabel(key) {
  const box = document.querySelector(`#panels input[data-key="${CSS.escape(key)}"]`);
  if (box) box.parentElement.lastChild.textContent = " " + draftTitle(key);
}
addEventListener("beforeunload", (e) => {
  if (!DIRTY.size) return;
  [...DIRTY].forEach(saveNow);
  e.preventDefault(); e.returnValue = "";
});

// Before a lesson goes to the site: drop empty paragraphs (but keep one under
// a heading that has nothing else). Returns true if it isn't ready yet.
function tidy(L) {
  for (let si = L.screens.length - 1; si >= 0; si--) {
    const S = L.screens[si];
    if (S.type !== "read" || !S.text) continue;
    for (let ti = S.text.length - 1; ti >= 0; ti--) {
      if (plain(S.text[ti])) continue;
      const alone = S.text.length === 1 && emptyScreen({ ...S, text: [] }) && L.screens.filter((s) => s.st === S.st).length === 1;
      if (!alone) OPS.delPara(L, si, ti);
    }
  }
  return L.stations.some((s) => !plain(s)) || L.screens.some((s) => s.type === "read" && s.text && s.text.length === 1 && !plain(s.text[0]));
}

// "כותרת" shows only on an empty paragraph that isn't the first thing in its section.
const tb = $("tb");
function hideTb() { tb.hidden = true; }
function showTb(el) {
  const [kind, si, ti] = el.dataset.p.split(".");
  const L = DATA[el.dataset.h] && DATA[el.dataset.h].L;
  if (kind !== "tx" || !L || cleanHtml(el)) return hideTb();
  const S = L.screens[+si];
  if (+ti === 0 && !L.screens.slice(0, +si).some((s) => s.st === S.st)) return hideTb();
  tb.innerHTML = `<button type="button">כותרת</button>`;
  const r = el.getBoundingClientRect();
  tb.style.top = `${r.top + scrollY - 30}px`;
  tb.style.right = `${document.documentElement.clientWidth - r.right - scrollX}px`;
  tb.hidden = false;
  tb.ed = el;
}
tb.addEventListener("mousedown", (e) => e.preventDefault());
tb.addEventListener("click", () => { if (tb.ed) runOp(tb.ed, "paraToHeading"); });

const page = $("page");
page.addEventListener("focusin", (e) => { const el = e.target.closest("[contenteditable]"); if (el) showTb(el); });
page.addEventListener("focusout", () => {
  setTimeout(() => { const a = document.activeElement; if (!a || !a.isContentEditable) hideTb(); }, 0);
});
page.addEventListener("input", (e) => {
  const el = e.target.closest("[contenteditable]");
  if (!el) return;
  setValue(DATA[el.dataset.h].L, el.dataset.p, cleanHtml(el));
  changed(el.dataset.h);
  showTb(el);
});
page.addEventListener("keydown", (e) => {
  const el = e.target.closest("[contenteditable]");
  if (!el) return;
  const kind = el.dataset.p.split(".")[0];
  if (e.key === "Enter") {
    e.preventDefault();
    if (e.shiftKey) return;
    if (kind === "tx") {
      // split at the caret, like a word processor
      const r = getSelection().getRangeAt(0);
      r.deleteContents();
      const tail = document.createRange();
      tail.selectNodeContents(el);
      tail.setStart(r.startContainer, r.startOffset);
      const box = document.createElement("div");
      box.appendChild(tail.extractContents());
      runOp(el, "splitPara", cleanHtml(box));
    } else if (kind === "st") runOp(el, "addParaInStation");
    else if (kind === "tt") runOp(el, "fromTitle");
    else el.blur();
  } else if (e.key === "Backspace" && !el.textContent.trim()) {
    if (kind === "tx") { e.preventDefault(); runOp(el, "delPara"); }
    else if (kind === "st" && +el.dataset.p.split(".")[1] > 0) { e.preventDefault(); runOp(el, "delHeading"); }
  }
});
// paste as plain text, so formatting from Word or other sites doesn't come along
page.addEventListener("paste", (e) => {
  if (!e.target.closest("[contenteditable]")) return;
  e.preventDefault();
  document.execCommand("insertText", false, (e.clipboardData.getData("text/plain") || "").replace(/\s*\n\s*/g, " "));
});

// Double-click any text (admin only) to start editing right there.
page.addEventListener("dblclick", async (e) => {
  if (!isAdmin || EDIT) return;
  const el = e.target.closest("[data-p]");
  const point = { x: e.clientX, y: e.clientY };
  EDIT = true;
  await render(el ? { h: el.dataset.h, p: el.dataset.p, point } : null);
});

// ---------- admin ----------
async function startAdmin() {
  try {
    const [f, store] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js"),
      import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js"),
    ]);
    httpsCallable = f.httpsCallable;
    fns = f.getFunctions(auth.getApp());
    fs = store;
  } catch (err) {
    say("לא הצלחתי לטעון את העריכה. נסו לרענן את הדף.");
    return;
  }
  // Editing lessons on the site doesn't depend on the drafts loading.
  try {
    await loadDrafts();
  } catch (err) {
    DRAFTS = [];
    DATA[NEW] = { L: newDraftData(), draft: true };
    say("תפריט העריכה לא נטען: " + ((err && (err.code || err.message)) || "שגיאה") + ". עריכת השיעורים עובדת כרגיל.");
  }
  await restoreBackups();
  await indexReady.catch(() => {});
  isAdmin = true;
  SELECTED = (loadSelection() || defaultSelection()).filter((k) => !isDraft(k) || DATA[k]);
  drawMenus();
  render();
}

import("./assets/js/auth.js").then((m) => {
  auth = m;
  m.watchAuthState((user) => {
    USER = user;
    if (user && user.email === ADMIN_EMAIL && !isAdmin) startAdmin();
    else if (GROUPS.length) drawMenus();
  });
}).catch(() => {});

function say(t) { $("msg").textContent = t; }  // shown only when something went wrong

// First visit: the first lesson; after that, whatever was open last time.
function defaultSelection() {
  const first = GROUPS[0] && GROUPS[0].lessons[0];
  return first ? [first.key] : [];
}
const indexReady = loadIndex();
indexReady.then(() => {
  if (isAdmin) return;
  SELECTED = (loadSelection() || defaultSelection()).filter((k) => !isDraft(k));
  drawMenus();
  render();
}).catch(() => { $("page").innerHTML = '<p class="empty">לא הצלחתי לטעון את רשימת השיעורים.</p>'; });
</script>
