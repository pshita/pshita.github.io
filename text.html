<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- maximum-scale: the iPhone zooms in on text being edited when it is smaller than 16px; this stops that (the text size changes with two fingers instead) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>טקסט | ארבעה אבות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@400;600&family=Rubik:wght@400;600;700&display=swap">
<style>
/* plain continuous text of the lessons, like a word-processor page */
:root{--ink:#111;--muted:#666;--line:#ddd;--desk:#e9e9ec;--page:#fff;--accent:#1a5fb4;--edit:#fff8d6;--text:'Frank Ruhl Libre',David,'Times New Roman',serif}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Arial,'Segoe UI',sans-serif}
/* the top bar hides; the mouse at the top of the screen (or a tap there) brings it back */
/* a solid strip along the top: more room to tap for the bar, and a hard edge (no blur
   over the text when scrolling, as Safari does under the status bar) */
#hot{position:fixed;top:0;left:0;right:0;height:22px;z-index:2;cursor:pointer;background:var(--page)}
/* bar and menus: same look as the site header and its menu (assets/css/style.css) */
:root{--s-bg:#faf6ee;--s-ink:#2b241b;--s-soft:#5c5347;--s-line:#e4d9c4;--s-accent-soft:#f1e3d1;--s-accent-strong:#6d3a22;--s-head:"Rubik","Heebo","Arial Hebrew",sans-serif}
.bar{position:fixed;top:0;left:0;right:0;z-index:3;transform:translateY(-100%);transition:transform .18s;background:#fff;border-bottom:1px solid var(--s-line);box-shadow:0 2px 10px rgba(43,36,27,.08);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--s-head);color:var(--s-ink)}
.bar.show{transform:none}
.bar button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
/* the site's menu, exactly as on every other page (site-header.css), inside this bar */
.site-header.sh-inline{position:static;border:0;background:none;box-shadow:none}
.bar .view{display:flex;align-items:center;gap:6px;font-size:.95rem;padding:8px 10px;border-radius:8px}
.bar .view:hover,.bar .view.open{background:var(--s-accent-soft);color:var(--s-accent-strong)}
.chev{width:16px;height:16px;flex:none;transition:transform .2s}
.view.open .chev,.sec.open>.sec-h .chev{transform:rotate(180deg)}
.panel.inmenu{position:static;min-width:0;max-width:none;max-height:none;overflow:visible;border:0;box-shadow:none;padding:0;background:none}
.panel{position:fixed;z-index:4;min-width:220px;max-width:calc(100vw - 16px);max-height:min(430px,calc(100vh - 90px));overflow-y:auto;background:#fff;border:1px solid var(--s-line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:10px;display:flex;flex-direction:column;gap:6px;font-family:var(--s-head);color:var(--s-ink);line-height:1.75}
.panel *{flex-shrink:0}
.panel[hidden]{display:none}
.panel a,.panel label,.sec-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--s-ink);text-decoration:none;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.panel a:hover,.panel label:hover,.sec-h:hover{background:var(--s-accent-soft);color:var(--s-accent-strong)}
.sec-h{width:100%;justify-content:space-between;border:0;background:none;font-family:"Heebo","Arial Hebrew",sans-serif;line-height:normal;text-align:start}
.sec-b{margin:4px 0 0;padding:6px;border:1px solid var(--s-line);border-radius:8px;background:var(--s-bg);display:flex;flex-direction:column;gap:2px}
.sec:not(.open) .sec-b{display:none}
.sec-b a,.sec-b label{font-size:.88rem}
.panel label.new{color:var(--s-soft)}
.panel .opt{border-bottom:1px solid var(--s-line);border-radius:8px 8px 0 0;padding-bottom:10px}
.panel .acct{border-top:1px solid var(--s-line);padding-top:10px;margin-top:4px;display:flex;flex-direction:column;gap:6px}
/* adding, moving and deleting lessons (admin), in "תצוגה" */
.panel .lrow{display:flex;align-items:center}
.panel .lrow label{flex:1;min-width:0}
.panel .lctl{display:flex;flex:none}
.panel .lctl button{border:0;background:none;font:inherit;font-size:.85rem;color:var(--s-soft);padding:4px 6px;border-radius:6px;cursor:pointer}
.panel .lctl button:hover{background:var(--s-accent-soft);color:var(--s-accent-strong)}
.panel .lctl .del:hover{background:#f6d8d2;color:#b23b2e}
.panel .lrow.busy{opacity:.5;pointer-events:none}
.panel .newl>button{border:1px dashed var(--s-line);background:none;font:inherit;font-size:.88rem;color:var(--s-soft);border-radius:8px;padding:6px 10px;cursor:pointer;width:100%;text-align:start}
.panel .nl-form{display:flex;flex-direction:column;gap:6px;padding:6px 4px}
.panel .nl-form[hidden]{display:none}
.panel .nl-form label{flex-direction:column;align-items:stretch;gap:2px;padding:0;font-size:.85rem;cursor:default;white-space:normal}
.panel .nl-form label:hover{background:none;color:var(--s-ink)}
.panel .nl-form input,.panel .nl-form select{font:inherit;padding:4px 8px;border:1px solid var(--s-line);border-radius:6px}
.panel .nl-actions{display:flex;gap:6px}
.panel .nl-actions button{font:inherit;font-size:.85rem;border:1px solid var(--s-line);background:#fff;border-radius:6px;padding:3px 12px;cursor:pointer}
.panel .nl-status{margin:0;font-size:.8rem;color:#b23b2e;white-space:normal}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;max-width:calc(100vw - 32px);background:#b00020;color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#msg:empty{display:none}
/* whether the changes are saved: yellow saved, black not saved, none while waiting to be saved */
#saveDot{position:fixed;top:6px;right:6px;z-index:5;width:10px;height:10px;border-radius:50%;background:#ffd400;box-shadow:0 0 0 2px #fff;transition:background .2s}
#saveDot.wait{display:none}
#saveDot.fail{background:#111}
/* undo / redo, in the top bar while editing */
#hist{display:flex}
#hist[hidden]{display:none}
.bar #hist button{width:38px;height:38px;border-radius:8px;font-size:20px;line-height:1}
.bar #hist button:hover:not(:disabled){background:var(--s-accent-soft);color:var(--s-accent-strong)}
.bar #hist button:disabled{opacity:.3;cursor:default}
/* bold / red on selected text */
/* search and replace, over every page shown */
.tools{display:flex;align-items:center;gap:6px}
.bar .icon{padding:8px}
/* pinching changes the text size (the lines rewrap), not the page zoom */
/* the page never gets wider than the screen and never moves sideways */
html,body{touch-action:pan-y;overflow-x:hidden;max-width:100%}
/* the iPhone can still pan sideways with only overflow-x:hidden; clip leaves nothing to pan to */
@supports (overflow-x:clip){html,body{overflow-x:clip}}
.page{overflow-wrap:break-word}
.bar .icon svg{width:20px;height:20px;display:block}
#find{position:fixed;top:10px;left:16px;z-index:6;background:#fff;border:1px solid var(--s-line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px;display:flex;flex-direction:column;gap:6px;font-family:var(--s-head);font-size:14px;max-width:calc(100vw - 32px)}
#find[hidden]{display:none}
#find .frow{display:flex;align-items:center;gap:4px}
#find input{font:inherit;width:190px;max-width:52vw;padding:6px 10px;border:1px solid var(--s-line);border-radius:8px;outline:none}
#find input:focus{border-color:#8a4b2e}
#find button{font:inherit;border:0;background:none;padding:5px 8px;border-radius:7px;cursor:pointer;color:var(--s-ink);white-space:nowrap}
#find button:hover{background:var(--s-accent-soft);color:var(--s-accent-strong)}
#findN{color:var(--s-soft);font-size:12px;min-width:44px;text-align:center}
/* a light selection, so text turned red or bold shows the change while still selected */
#page ::selection{background:#d6e6fb}
::highlight(hits){background:#ffe58a}
::highlight(hit-now){background:#f0a33c;color:#000}
#fmt{position:absolute;z-index:4;display:flex;gap:2px;background:#222;border-radius:7px;padding:3px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#fmt[hidden]{display:none}
#fmt button{width:30px;height:28px;border:0;border-radius:5px;background:none;color:#fff;font:700 15px Arial,sans-serif;cursor:pointer}
#fmt button:hover{background:#444}
#fmt .red{color:#ff8a7a}
#fmt .it{font-style:italic;font-family:Georgia,serif}
#fmt .hd{width:auto;padding:0 8px;font-size:13px;border-inline-start:1px solid #555;border-radius:0 5px 5px 0}
.page{min-height:100vh;background:var(--page);padding:22px clamp(16px,3vw,40px) 48px;font-family:var(--text);font-size:var(--fs,17px);line-height:1.4}
/* the lesson's name, and on the same line its page and amud */
.page .lh{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 16px;margin:0 0 14px}
.page .lsn+.lsn .lh{margin-top:40px;padding-top:26px;border-top:1px solid var(--line)}
.page h1{font-size:1.47em;font-weight:700;margin:0;flex:0 1 auto}
.page .ref{color:var(--muted);font-size:.82em;margin:0;flex:0 1 auto}
/* the site's boxes (בקיצור, השוואה, מונחים...), marked with a line at the side */
.page .blk{border-inline-start:3px solid var(--s-line);padding-inline-start:10px}
.page .blk .lbl{color:var(--muted);font-weight:700}
.page .icard .iw{color:var(--muted)}
.page h2{font-size:1.12em;font-weight:700;margin:20px 0 4px}
.page p{margin:0 0 6px;text-align:justify}
.page .q{margin:10px 0 2px;font-weight:700}
.page ol{list-style-type:hebrew;margin:0 0 8px;padding-inline-start:28px}
.page li.ok{font-weight:700}
.page li.ok::after{content:" ✓"}
.page p.ok{font-weight:700}
.page .qk{color:var(--muted);font-weight:400;font-size:.85em}
.page .qi{margin:0 0 4px;padding-inline-start:28px}
.page .why{color:var(--muted);font-size:.9em;margin:0 0 10px}
/* each question with a button that deletes it */
.page .qb{position:relative;padding-inline-start:26px}
.page .qb .qdel{position:absolute;inset-inline-start:0;top:9px;width:20px;height:20px;padding:0;border:0;border-radius:4px;background:none;color:var(--muted);font-size:15px;line-height:20px;cursor:pointer}
.page .qb .qdel:hover{background:#f3e1dc;color:#a33}
.page .qb .qdel.sure{width:auto;padding:0 8px;background:#a33;color:#fff;font:600 13px/20px Arial,sans-serif;white-space:nowrap;z-index:2}
/* a paragraph that stays on this page only (not in the lesson) */
.page .parth{display:flex;align-items:center;gap:8px;margin:28px 0 0;padding:8px 12px;background:#14213D;color:#FFF8EC;border-radius:10px;font-size:1.15em;font-weight:700}
.page .parth [data-ph]:empty::before{color:#AEB9D6}
.page .parth .pdel{border:0;border-radius:4px;background:none;color:#AEB9D6;font-size:14px;cursor:pointer;padding:2px 6px}
.page .parth .pdel.sure{background:#a33;color:#fff;font:600 13px Arial,sans-serif}
.page p.shared{border-inline-start:3px solid #1A7D72;padding-inline-start:8px}
.page .shlbl{margin:10px 0 2px;font:600 12px/1.4 Arial,sans-serif;color:#1A7D72}
.page p.tonly,.page h2.tonly{color:var(--muted);background:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(0,0,0,.035) 6px 12px);outline:1px dashed #bbb;outline-offset:2px}
#fmt .to.on{background:#555}
/* the page and amud: two lists right after the name; how many questions the lesson has */
.page .refsel{font-size:.82em;color:var(--muted);white-space:nowrap}
.page .refsel select{font:inherit;color:var(--ink,#222);background:none;border:0;border-bottom:1px dashed var(--muted);padding:0 2px;cursor:pointer}
.page .qn{font-size:.82em;color:var(--muted);white-space:nowrap}
/* the lesson as students see it, over the page */
.page .pv{font:600 13px/1 Arial,sans-serif;color:var(--muted);background:none;border:1px solid #ccc;border-radius:999px;padding:5px 12px;cursor:pointer}
.page .pv:hover{color:#222;border-color:#888}
.page .pvw{display:inline-flex;gap:6px}
.page .pv.up.sure{background:#1A7D72;border-color:#1A7D72;color:#fff}
#pvBox{position:fixed;inset:0;z-index:60;background:rgba(20,33,61,.55);display:flex;align-items:center;justify-content:center;padding:12px}
#pvBox[hidden]{display:none}
#pvBox iframe{width:min(420px,100%);height:min(860px,100%);border:0;border-radius:18px;background:#FFF8EC;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#pvBox .x{position:absolute;top:12px;inset-inline-end:12px;width:38px;height:38px;border:0;border-radius:50%;background:#fff;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
@media (max-width:640px){#pvBox{padding:0}#pvBox iframe{width:100%;height:100%;border-radius:0}#pvBox .x{top:auto;bottom:16px}}
.page .tfa{font:inherit;font-weight:700;color:inherit;background:none;border:0;border-bottom:1px dashed var(--muted);padding:0;cursor:pointer}
.page table{border-collapse:collapse;margin:8px 0 12px;font-size:.88em;max-width:100%}
.page table.fit{width:100%;table-layout:fixed}
.page td,.page th{border:1px solid #999;padding:3px 8px}
.page .note{color:var(--muted);font-size:14px;font-family:Arial,sans-serif}
.empty{color:var(--muted)}
.page [data-ph]:empty::before{content:attr(data-ph);color:#aaa}
/* an empty piece inside a line (an explanation, an answer) keeps some room, so a click can get into it */
.page span[data-p]:empty{display:inline-block;min-width:4em;min-height:1.2em;vertical-align:bottom;border-bottom:1px dashed #bbb}
/* edit mode (double-click any text, admin only) */
/* the whole page is one editing area: select and delete across paragraphs like in a document */
.page.editing{outline:none}
.editing [data-p]{border-radius:3px;transition:background .15s}
.editing [data-p]:hover{background:#f6f6f6}
.editing .cur{background:var(--edit)}
.editing span[data-p],.editing b[data-p]{display:inline-block;min-width:.6em;max-width:100%}
#tb{position:absolute;z-index:2;font:13px Arial,sans-serif}
#tb[hidden]{display:none}
#tb{display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100vw - 16px)}
#tb button{font:inherit;padding:3px 10px;border:1px solid #bbb;border-radius:5px;background:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#tb button:hover{border-color:#8a4b2e;color:#6d3a22}
@media (max-width:640px){.page{padding:20px 14px 40px;font-size:var(--fs,16px)}}
@media print{.bar,.panel,#tb,#hot,#fmt,#msg,#find,#hist{display:none}body{background:#fff}.page{padding:0;min-height:0}}
</style>

<script type="module">
// Pages shown here, by key:
//   "lessons/<id>.html" - a lesson on the site (content in lessons/data/<id>.json, saved to GitHub)
//   "draft:<id>"        - a lesson being written, not on the site yet (kept on GitHub like the
//                         lessons, but on no list of the site; see loadDrafts)
//   "draft:new"         - the empty page at the end of the "עריכה" menu; typing in it makes it a draft
// The page is for the admin only (anyone else is sent to the home page).
let auth = null, httpsCallable = null, fns = null, fs = null, isAdmin = false;

const ADMIN_EMAIL = "ufd5a4a70e876fc8672e3d112e6866c55@arba-avot-users.local";
const SEL_KEY = "pshita.text.selected";
// lessons renamed from English names to numbers (daf, amud, number: 213): the saved selection follows
const RENAMED = { "avot-vetoldot": "211", "shor-umave": "212", "lo-hari-hashor": "213", "gabei-shabbat-tanan": "214", "umai-ika": "215", "gabei-tumaot-tanan": "216", "shlosha-avot-beshor": "221", "keren-manlan": "222", "toldah-dekeren": "223", "mai-shena-negicha": "224", "mai-shena-gabei-adam": "225", "muad-livhema": "226" };
const renamedKey = (k) => k.replace(/^lessons\/([a-z0-9-]+)\.html$/, (m, id) => (RENAMED[id] ? `lessons/${RENAMED[id]}.html` : /^\d(-\d)+$/.test(id) ? `lessons/${id.replace(/-/g, "")}.html` : m));
const NEW = "draft:new";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const isDraft = (key) => key.startsWith("draft:");
let GROUPS = [], DRAFTS = [], DATA = {}, EDIT = false;
let SELECTED = [];

// ---------- loading ----------
async function loadIndex() {
  const site = await (await fetch("lessons.json", { cache: "no-cache" })).json();
  GROUPS = site.groups.map((g) => ({ name: g.title, lessons: g.lessons.map((l) => ({ key: `lessons/${l.id}.html`, title: l.title })) }));
}

const dataUrl = (href) => href.replace(/^lessons\/([^/]+)\.html$/, "lessons/data/$1.json");
const newDraftData = () => ({ title: "", ref: "", stations: [""], screens: [{ type: "read", st: 0, text: [""] }] });

async function loadLesson(href) {
  const r = await fetch(dataUrl(href), { cache: "no-cache" });
  if (!r.ok) throw new Error(r.status);
  return { L: await r.json() };
}

// For editing, read the lesson straight from the repository (the site
// itself can lag a few minutes behind a save) and remember that exact
// source, so the server can refuse to overwrite a newer version.
const LOADING = {};
function loadForEdit(href) {
  if (!LOADING[href]) LOADING[href] = loadForEditOnce(href).finally(() => { delete LOADING[href]; });
  return LOADING[href];
}
async function loadForEditOnce(href) {
  const d = DATA[href];
  if (d && d.base) return;
  try {
    const res = await httpsCallable(fns, "getLessonData")({ path: href });
    DATA[href] = { L: JSON.parse(res.data.src), base: res.data.src };
  } catch (e) {
    if (!d) DATA[href] = await loadLesson(href).catch(() => null);
    if (DATA[href]) { DATA[href].noEdit = true; DATA[href].why = (e && e.message) || ""; }
  }
}

// Drafts are kept on GitHub like the lessons, but not on the site's lists (listDrafts,
// saveDraft, deleteDraft, publishDraft in functions/index.js).
async function loadDrafts() {
  const res = await httpsCallable(fns, "listDrafts")();
  DRAFTS = [];
  res.data.drafts.forEach((d) => {
    let L;
    try { L = JSON.parse(d.src); } catch (e) { return; }
    DRAFTS.push({ id: d.id, createdAt: d.createdAt || 0 });
    DATA["draft:" + d.id] = { L, draft: true, createdAt: d.createdAt || 0 };
  });
  DRAFTS.sort((a, b) => a.createdAt - b.createdAt);
  DATA[NEW] = { L: newDraftData(), draft: true };
}
// ---------- rendering ----------
// Text keeps only bold, italic and red; every other tag or attribute (colors
// from the lesson design, formatting pasted from elsewhere) is dropped.
const RED = '<span style="color:#B5432A">';
const isRedEl = (n) => n.style.color === "rgb(181, 67, 42)" || (n.getAttribute("color") || "").toLowerCase() === "#b5432a";
function ser(node, keepColor = true) {
  let out = "";
  node.childNodes.forEach((n) => {

async function render(focus) {
  const list = SELECTED.filter((k) => !isDraft(k) || DATA[k]);
  if (!list.length) { $("page").innerHTML = '<p class="empty">בחרו שיעור בתפריט למעלה.</p>'; return; }
  await Promise.all(list.map(async (key) => {
    if (isDraft(key)) return;
    if (EDIT) await loadForEdit(key);
    else if (!DATA[key]) DATA[key] = await loadLesson(key).catch(() => null);
  }));
  const page = $("page");
  page.classList.toggle("editing", EDIT);
  page.contentEditable = EDIT ? "true" : "false";
  histButtons();
  page.innerHTML = list.map((k) => {
    const d = DATA[k];
    return d ? renderLesson(k, d, SHOWQ) : `<p class="empty"${EDIT ? ' contenteditable="false"' : ""}>לא נטען: ${esc(k)}</p>`;
  }).join("");
  CUR = null;
  fitTables();
  if (RESTORE && !focus) goToPos();
  if (EDIT) page.querySelectorAll("[data-p]").forEach((el) => { if (el.isContentEditable) BASE.set(el, cleanHtml(el)); });
  hideTb();
  if (!$("find").hidden) runFind(false);
  if (focus && EDIT) {
    page.focus({ preventScroll: Boolean(focus.point) });
    const el = focus.p && document.querySelector(`[data-h="${CSS.escape(focus.h)}"][data-p="${focus.p}"]`);
    if (focus.point) {
      // edit mode can shift the layout a little: keep the clicked piece where it was
      if (el && focus.top !== undefined) scrollBy(0, el.getBoundingClientRect().top - focus.top);
      const r = el && el.getBoundingClientRect(), inside = r && focus.point.y >= r.top && focus.point.y <= r.bottom;
      if (el && !inside) placeCaret(el, false);
      else { placeCaretAtPoint(page, focus.point); snapCaret(el || document.elementFromPoint(focus.point.x, focus.point.y)); }
    }
    else if (el && focus.offset !== undefined) placeCaretAtOffset(el, focus.offset);
    else if (el) placeCaret(el, focus.start);

    if (el && !focus.point) {

// Where a new screen for station k goes: before the first screen of a later station (or the summary).
function stationEnd(L, k) {
  const i = L.screens.findIndex((s) => s.type === "summary" || (s.st !== undefined && s.st > k));
  return i === -1 ? L.screens.length : i;
}

function dropStationIfEmpty(L, k) {
  if (L.screens.some((s) => s.st === k)) return;
  L.stations.splice(k, 1);
  L.screens.forEach((s) => { if (s.st !== undefined && s.st > k) s.st--; });
}

// The site's boxes that can be added from here, as they start out, and the first / last
// piece of each one's items.
const NEW_ITEM = {
  gloss: () => "",
  pills: () => "",
  cards: (prev) => ({ t: "", s: "", c: prev && prev.c === "red" ? "teal" : "red" }),
  verses: (prev) => ({ src: "", before: "", word: "", after: "", c: (prev && prev.c) || "red" }),
};
const NEW_BLOCK = {
  short: () => ({ k: "short", text: "" }),
  cards: () => ({ k: "cards", items: [NEW_ITEM.cards(), NEW_ITEM.cards({ c: "red" })] }),
  gloss: () => ({ k: "gloss", items: [""] }),
  verses: () => ({ k: "verses", items: [NEW_ITEM.verses()] }),
  pills: () => ({ k: "pills", items: [""] }),
};
const BLOCK_NAMES = { short: "בקיצור", cards: "השוואה", gloss: "מונחים", verses: "פסוקים", pills: "מילים מסומנות" };
const FIRST_PIECE = { short: "sh", cards: "ct", gloss: "gl", verses: "vb", pills: "pl" };
const LAST_PIECE = { short: "sh", cards: "cs", gloss: "gl", verses: "vs", pills: "pl" };
const BLOCK_PIECE = /^(sh|ct|cs|gl|pl|vb|vw|va|vs)$/;
// the names of the kinds of questions, as in the lesson player
const Q_KIND = { mc: "אמריקאית", tf: "נכון / לא נכון", fill: "השלמת מילה", build: "בניית משפט", match: "התאמת זוגות", order: "סדרו לפי הסדר", sort: "מיון לסלים", marker: "מרקר", flip: "קלפים הפוכים", open: "שאלה לחשיבה" };
// all the text in a box, an item of one, or anything else in the lesson data (colors and kinds aside)
const itemText = (x) => plain(typeof x === "string" ? x : Array.isArray(x) ? x.map(itemText).join(" ")
  : x && typeof x === "object" ? Object.entries(x).filter(([k]) => k !== "k" && k !== "c").map(([, v]) => itemText(v)).join(" ") : "");

const emptyScreen = (S) => !S.text.length && !(S.before || []).length && !(S.after || []).length && !S.comic && !S.quote && !S.kicker;

// The end of a paste, marked in the text: found, taken out, and returned as where the caret goes.
const PASTE_END = "\u0002";
function takePasteEnd(L) {
  const take = (v) => { const i = v.indexOf(PASTE_END); return { v: v.slice(0, i) + v.slice(i + 1), offset: textLen(v.slice(0, i)) }; };
  const k = L.stations.findIndex((x) => x.includes(PASTE_END));
  if (k > -1) { const t = take(L.stations[k]); L.stations[k] = t.v; return { p: `st.${k}`, offset: t.offset }; }
  for (let si = 0; si < L.screens.length; si++) {
    const ti = (L.screens[si].text || []).findIndex((x) => x.includes(PASTE_END));
    if (ti > -1) { const t = take(L.screens[si].text[ti]); L.screens[si].text[ti] = t.v; return { p: `tx.${si}.${ti}`, offset: t.offset }; }
  }
  return null;
}

const OPS = {
  // Enter in a paragraph: whatever follows the caret becomes a new paragraph after it
  splitPara(L, si, ti, rest) { L.screens[si].text.splice(ti + 1, 0, rest); return { p: `tx.${si}.${ti + 1}`, start: true }; },
  // Enter in a heading: a new paragraph at the top of its section
  addParaInStation(L, k) {
    const si = L.screens.findIndex((s) => s.type === "read" && s.st === k);
    if (si > -1) {
      // reuse an empty first paragraph instead of adding another
      const t = L.screens[si].text;
      if (!t.length || plain(t[0])) t.unshift("");
      return { p: `tx.${si}.0` };
    }
    const at = L.screens.findIndex((s) => s.st === k);
    const pos = at > -1 ? at : stationEnd(L, k);
    L.screens.splice(pos, 0, { type: "read", st: k, text: [""] });
    return { p: `tx.${pos}.0` };
  },
  // Enter in the title: to the first heading
  fromTitle() { return { p: "st.0" }; },
  // An empty paragraph becomes a heading; what follows it in the section moves under the new heading.
  paraToHeading(L, si, ti) {
    const S = L.screens[si], k = S.st;
    S.text.splice(ti, 1);
    const rest = S.text.splice(ti);
    L.screens.forEach((s, j) => {
      if (s.st === undefined || s.type === "summary") return;
      if (s.st > k) s.st++;
      else if (s.st === k && j > si) s.st = k + 1;
    });
    L.stations.splice(k + 1, 0, "");
    const N = { type: "read", st: k + 1, text: rest.length ? rest : [""] };
    if (rest.length && S.after) { N.after = S.after; delete S.after; }
    L.screens.splice(si + 1, 0, N);
    if (emptyScreen(S)) L.screens.splice(si, 1);
    return { p: `st.${k + 1}` };
  },
  // Selected text becomes a heading: the paragraph splits around it, and what
  // follows (the rest of the paragraph and of the section) goes under the new heading.
  // Pasted paragraphs and headings go where the caret was, splitting that paragraph.
  pasteBlocks(L, si, ti, before, blocks, after) {
    const H = "\u0001H:", items = [];
    blocks.forEach((b, i) => {
      if (b.type === "p") items.push(i === 0 ? before + b.html : b.html);
      else { if (i === 0 && plain(before)) items.push(before); items.push(H + b.name); }
    });
    // a mark at the end of the pasted text, to put the caret there afterwards
    items[items.length - 1] += PASTE_END;
    if (items[items.length - 1].startsWith(H)) { if (plain(after)) items.push(after); }
    else items[items.length - 1] += after;
    const S = L.screens[si];
    S.text.splice(ti, 1, ...items.filter((t) => t.startsWith(H) || plain(t)));
    if (!S.text.length) S.text.push("");
    // headings from the last to the first, so the earlier positions stay put
    for (let j = S.text.length - 1; j >= 0; j--) {
      if (L.screens[si] === S && S.text[j] && S.text[j].startsWith(H)) OPS.toHeading(L, si, j, "", S.text[j].slice(H.length), "");
    }
    return takePasteEnd(L);
  },
  toHeading(L, si, ti, before, name, after) {
    const S = L.screens[si], k = S.st;
    const rest = S.text.splice(ti + 1);
    if (plain(after)) rest.unshift(after);
    if (plain(before)) S.text[ti] = before; else S.text.splice(ti, 1);
    L.screens.forEach((s, j) => {
      if (s.st === undefined || s.type === "summary") return;
      if (s.st > k) s.st++;
      else if (s.st === k && j > si) s.st = k + 1;
    });
    L.stations.splice(k + 1, 0, name);
    const N = { type: "read", st: k + 1, text: rest.length ? rest : [""] };
    if (rest.length && S.after) { N.after = S.after; delete S.after; }
    L.screens.splice(si + 1, 0, N);
    if (emptyScreen(S)) L.screens.splice(si, 1);
    return { p: `tx.${L.screens.indexOf(N)}.0`, start: true };
  },
  // An empty paragraph becomes one of the site's boxes. The paragraphs after it move to a
  // new screen of the same section, so the box stays right where the paragraph was.
  insertBlock(L, si, ti, k) {
    const S = L.screens[si];
    const rest = S.text.splice(ti + 1);
    S.text.splice(ti, 1);
    if (rest.length || (S.after || []).length) {
      const N = { type: "read", st: S.st, text: rest };
      if (S.after) N.after = S.after;
      L.screens.splice(si + 1, 0, N);
      S.after = [];
    }
    S.after = S.after || [];
    S.after.push(NEW_BLOCK[k]());
    return { p: `${FIRST_PIECE[k]}.${si}.after.${S.after.length - 1}${k === "short" ? "" : ".0"}`, start: true };
  },
  // A box goes; if its screen is left with nothing else, it joins the screen after it.
  delBlock(L, si, side, bi) {
    const S = L.screens[si];
    S[side].splice(bi, 1);
    if (!S[side].length) delete S[side];
    const N = L.screens[si + 1];
    if (!S.before && !S.after && N && N.type === "read" && N.st === S.st && !N.kicker && !N.comic && !N.quote) {
      S.text.push(...N.text);
      if (N.before) S.before = N.before;
      if (N.after) S.after = N.after;
      L.screens.splice(si + 1, 1);
    }
    if (emptyScreen(S)) S.text = [""];
    return S.text.length ? { p: `tx.${si}.${S.text.length - 1}` } : null;
  },
  // Enter in a box: a new item in a list (terms, cards, verses, words); in "בקיצור",
  // or in an empty last item, a new paragraph after the box.
  blockEnter(L, si, side, bi, i) {
    const S = L.screens[si], b = S[side][bi], at = `${si}.${side}.${bi}`;
    if (b.k !== "short" && b.k !== "bars") {
      const last = i === b.items.length - 1, empty = !itemText(b.items[i]);
      if (!(last && empty && b.items.length > 1)) {
        b.items.splice(i + 1, 0, NEW_ITEM[b.k](b.items[i]));
        return { p: `${FIRST_PIECE[b.k]}.${at}.${i + 1}`, start: true };
      }
      b.items.splice(i, 1);
    }
    const N = L.screens[si + 1];
    if (N && N.type === "read" && N.st === S.st) { N.text.unshift(""); return { p: `tx.${si + 1}.0` }; }
    L.screens.splice(si + 1, 0, { type: "read", st: S.st, text: [""] });
    return { p: `tx.${si + 1}.0` };
  },
  // Backspace at the start of an empty piece of a box: its item goes, and with the last item the box.
  blockBack(L, si, side, bi, i) {
    const b = L.screens[si][side][bi], at = `${si}.${side}.${bi}`;
    if (b.k === "short" || b.k === "bars") return OPS.delBlock(L, si, side, bi);
    if (itemText(b.items[i])) return { p: `${FIRST_PIECE[b.k]}.${at}.${i}` };  // the rest of this item still has text
    if (b.items.length === 1) return OPS.delBlock(L, si, side, bi);
    b.items.splice(i, 1);
    return { p: `${LAST_PIECE[b.k]}.${at}.${Math.max(0, i - 1)}` };
  },
  // Backspace in an empty paragraph
  delPara(L, si, ti) {
    const S = L.screens[si];
    S.text.splice(ti, 1);
    const prev = ti > 0 ? { p: `tx.${si}.${ti - 1}` } : null;
    if (emptyScreen(S)) {
      L.screens.splice(si, 1);
      dropStationIfEmpty(L, S.st);
    }
    return prev;
  },
  // Backspace in an empty heading: its section joins the one before it
  delHeading(L, k) {
    if (k === 0) return null;
    L.screens.forEach((s) => { if (s.st !== undefined && s.type !== "summary" && s.st >= k) s.st--; });
    L.stations.splice(k, 1);
    return { p: `st.${k - 1}` };
  },
};

function runOp(el, name, ...extra) {
  const key = el.dataset.h, a = el.dataset.p.split(".").map((x) => isNaN(x) ? x : +x);
  const L = DATA[key].L;
  snapshot(key);
  setValue(L, el.dataset.p, cleanHtml(el));
  const next = OPS[name](L, ...a.slice(1), ...extra);
  const k = changed(key);
  return render(next ? { h: k, ...next } : null);
}
// A change made to the data directly (not through one piece): save, redraw, put the caret back.
function commit(key, next) {
  const k = changed(key);
  return render(next ? { h: k, ...next } : null);
}

// ---------- autosave ----------
// Drafts save to Firestore a moment after typing stops; lessons on the site
// save to GitHub after a slightly longer pause (each save is a commit).
// Only a failure is shown.
const DIRTY = new Set(), TIMERS = {}, CHAIN = {};
// The dot in the corner: saved, waiting, or failed (checked twice a second).
const SAVE_FAILED = new Set();
function showSaveState() {
  const dot = $("saveDot");
  if (!isAdmin) return;
  dot.hidden = false;
  dot.className = SAVE_FAILED.size ? "fail" : DIRTY.size ? "wait" : "";
}
setInterval(showSaveState, 500);

// Every saved version of a lesson or draft is also kept in this browser (the last 20), for
// safety on top of the site's own history (each save of a lesson is a commit on GitHub).
const HISTORY_KEY = "pshita.text.history";
function keepVersion(key) {
  try {
    const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    h.push({ key, at: new Date().toISOString(), L: DATA[key].L });
    let list = h.slice(-20);
    // if the browser is out of room, keep fewer
    while (list.length) {
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); break; } catch (e) { list = list.slice(1); }
    }
  } catch (e) {}
}

function changed(key) {
  if (key === NEW) key = promoteNew();
  DIRTY.add(key);
  clearTimeout(TIMERS[key]);
  TIMERS[key] = setTimeout(() => saveNow(key), 4000);
  if (isDraft(key)) updateDraftLabel(key);
  backup(key);
  return key;
}

// Every change is also kept in this browser until it's saved, so nothing
// typed is lost if a save fails or the page is closed first.
const BACKUP_KEY = "pshita.text.unsaved";
function readBackup() {
  let b = {};
  try { b = JSON.parse(localStorage.getItem(BACKUP_KEY)) || {}; } catch (e) {}
  // drafts kept by the previous version of this page
  try { Object.entries(JSON.parse(localStorage.getItem("pshita.text.drafts")) || {}).forEach(([id, v]) => { b["draft:" + id] = b["draft:" + id] || v; }); } catch (e) {}
  return b;
}
function writeBackup(b) {
  try { localStorage.setItem(BACKUP_KEY, JSON.stringify(b)); localStorage.removeItem("pshita.text.drafts"); } catch (e) {}
}
function backup(key) {
  const b = readBackup(), d = DATA[key];
  b[key] = d.draft ? { L: d.L, createdAt: d.createdAt } : { L: d.L, base: d.base };
  writeBackup(b);
}
function dropBackup(key) { const b = readBackup(); delete b[key]; writeBackup(b); }
// On opening the page: put back whatever wasn't saved last time, and save it.
// The lesson on the site (its source) has the same content as `L` would once saved.
const canon = (x) => JSON.stringify(x, (k, v) => (v && typeof v === "object" && !Array.isArray(v) ? Object.fromEntries(Object.keys(v).sort().map((n) => [n, v[n]])) : v));
function sameLesson(src, L) {
  try {
    const copy = JSON.parse(JSON.stringify(L));
    tidy(copy);
    return canon(JSON.parse(src)) === canon(copy);
  } catch (e) { return false; }
}
async function restoreBackups() {
  for (const [key, v] of Object.entries(readBackup())) {
    if (isDraft(key)) {
      if (!DATA[key]) DRAFTS.push({ id: key.slice(6), createdAt: v.createdAt });
      DATA[key] = { L: v.L, draft: true, createdAt: v.createdAt };
    } else {
      // a lesson: only if nobody changed it on the site since
      let src = null;
      try { src = (await httpsCallable(fns, "getLessonData")({ path: key })).data.src; } catch (e) {}
      if (src === null) continue;
      if (src !== v.base) {
        // already on the site (a save that went through but wasn't confirmed here): nothing to restore
        if (sameLesson(src, v.L)) { dropBackup(key); continue; }
        say(`יש במחשב הזה שינויים שלא נשמרו ב"${plain(v.L.title)}", אבל השיעור השתנה מאז באתר, אז הם לא הוחזרו.`);
        continue;
      }
      DATA[key] = { L: v.L, base: src };
    }
    DIRTY.add(key);
    TIMERS[key] = setTimeout(() => saveNow(key), 800);
  }
  DRAFTS.sort((a, b) => a.createdAt - b.createdAt);
}
function saveNow(key) {
  clearTimeout(TIMERS[key]);
  CHAIN[key] = (CHAIN[key] || Promise.resolve()).then(() => doSave(key));
  return CHAIN[key];
}
async function doSave(key) {
  if (!DIRTY.has(key)) return;
  DIRTY.delete(key);
  const d = DATA[key];
  let titleError = false;
  try {
    if (isDraft(key) && draftEmpty(d.L)) {
      // everything was deleted: the page goes too
      await httpsCallable(fns, "deleteDraft")({ id: key.slice(6) });
      if (!DIRTY.has(key) && draftEmpty(d.L)) removeDraft(key);
      return;
    } else if (isDraft(key)) {
      await httpsCallable(fns, "saveDraft")({ id: key.slice(6), lesson: d.L, createdAt: d.createdAt });
    } else {
      const copy = JSON.parse(JSON.stringify(d.L));
      // an empty heading or a heading with no text yet: wait until it's filled
      if (tidy(copy)) { DIRTY.add(key); return; }
      const res = await httpsCallable(fns, "saveLessonData")({ path: key, lesson: copy, base: d.base });
      d.base = res.data.src;
      // saved, but the lesson list didn't take the new name (the next save tries again)
      titleError = Boolean(res.data.titleError);
    }
    // saved: keep this version in the browser too, and drop the copy that waited for the
    // save (or refresh it if more was typed meanwhile)
    keepVersion(key);
    SAVE_FAILED.delete(key);
    if (DIRTY.has(key)) backup(key); else dropBackup(key);
    if (titleError) say("התוכן נשמר, אבל השם החדש לא עודכן ברשימת השיעורים. נסו לשנות אותו שוב.");
    else if (!DIRTY.size) say("");
  } catch (err) {
    DIRTY.add(key);
    SAVE_FAILED.add(key);
    const why = ((err && err.message) || "שגיאה").replace(/[.\s]+$/, "");
    say(`השמירה לא הצליחה: ${why}. השינויים שמורים במחשב הזה, וננסה שוב בשינוי הבא.`);
  }
}
// A draft with no text left at all (name, page line, headings, paragraphs, boxes).
const draftEmpty = (L) => !itemText([L.title, L.ref, L.stations, L.screens.map((x) => [x.text, x.before, x.after])]);
function removeDraft(key) {
  DRAFTS = DRAFTS.filter((x) => "draft:" + x.id !== key);
  delete DATA[key];
  dropBackup(key);
  DIRTY.delete(key);
  clearTimeout(TIMERS[key]);
  // it disappears from the page and from the menu; if the caret is still in it, an
  // unsaved empty page takes its place, so typing can go on
  const typing = CUR && CUR.dataset.h === key && SELECTED.includes(key);
  SELECTED = SELECTED.filter((k) => k !== key && (!typing || k !== NEW));
  if (typing) { DATA[NEW] = { L: newDraftData(), draft: true }; SELECTED.push(NEW); }
  saveSelection();
  drawMenus();
  render(typing ? { h: NEW, p: "tt" } : null);
}
// The empty "עמוד חדש" became a draft once something was typed in it.
function promoteNew() {
  const id = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const key = "draft:" + id;
  DATA[key] = { ...DATA[NEW], createdAt: Date.now() };
  DATA[NEW] = { L: newDraftData(), draft: true };
  DRAFTS.push({ id, createdAt: DATA[key].createdAt });
  document.querySelectorAll(`[data-h="${NEW}"]`).forEach((el) => el.dataset.h = key);
  [...UNDO, ...REDO].forEach((u) => { if (u.key === NEW) u.key = key; });
  SELECTED = SELECTED.map((k) => (k === NEW ? key : k));
  saveSelection();
  drawMenus();
  return key;
}
function updateDraftLabel(key) {
  const box = document.querySelector(`#panels input[data-key="${CSS.escape(key)}"]`);
  if (box) box.parentElement.lastChild.textContent = " " + draftTitle(key);
}
addEventListener("beforeunload", (e) => {
  if (!DIRTY.size) return;
  [...DIRTY].forEach(saveNow);
  e.preventDefault(); e.returnValue = "";
});

// Before a lesson goes to the site: drop empty paragraphs (but keep one under
// a heading that has nothing else). Returns true if it isn't ready yet.
function tidy(L) {
  // boxes (and items of boxes) with no text are left out
  L.screens.forEach((S) => ["before", "after"].forEach((side) => {
    // boxes are lists on reading screens; a "fill" question's before/after is its text
    if (S.type !== "read" || !Array.isArray(S[side])) return;
    S[side] = S[side].filter((b) => {
      if (b.items) b.items = b.items.filter(itemText);
      return itemText(b);
    });
    if (!S[side].length) delete S[side];
  }));
  for (let si = L.screens.length - 1; si >= 0; si--) {
    const S = L.screens[si];
    if (S.type === "read" && S.text && !S.text.length && emptyScreen(S)) { L.screens.splice(si, 1); dropStationIfEmpty(L, S.st); continue; }
    if (S.type !== "read" || !S.text) continue;
    for (let ti = S.text.length - 1; ti >= 0; ti--) {
      if (plain(S.text[ti])) continue;
      const alone = S.text.length === 1 && emptyScreen({ ...S, text: [] }) && L.screens.filter((s) => s.st === S.st).length === 1;
      if (!alone) OPS.delPara(L, si, ti);
    }
  }
  return !plain(L.title) || L.stations.some((s) => !plain(s)) || L.screens.some((s) => s.type === "read" && s.text && s.text.length === 1 && !plain(s.text[0]));
}

// Over an empty paragraph: "כותרת" (unless it's the first thing in its section) and
// "הוספת תיבה", which opens the list of the site's boxes. In a box: "מחיקת התיבה".
const tb = $("tb");
function hideTb() { tb.hidden = true; }
function showTb(el, boxes = false) {
  const [kind, si, ti] = el.dataset.p.split(".");
  const L = DATA[el.dataset.h] && DATA[el.dataset.h].L;
  if (!L) return hideTb();
  if (BLOCK_PIECE.test(kind)) tb.innerHTML = `<button type="button" data-act="delBlock">מחיקת התיבה</button>`;
  else if (kind !== "tx" || cleanHtml(el)) return hideTb();
  else if (boxes) tb.innerHTML = Object.entries(BLOCK_NAMES).map(([k, n]) => `<button type="button" data-act="insertBlock" data-k="${k}">${n}</button>`).join("");
  else {
    const S = L.screens[+si], first = +ti === 0 && !L.screens.slice(0, +si).some((s) => s.st === S.st);
    tb.innerHTML = (first ? "" : `<button type="button" data-act="paraToHeading">כותרת</button>`) + `<button type="button" data-act="boxes">הוספת תיבה ▾</button>`;
  }
  const r = el.getBoundingClientRect();

    if (seen.has(id)) return;
    seen.add(id);
    const [si, side, bi] = p.dataset.blk.split("."), b = DATA[key] && DATA[key].L.screens[+si][side][+bi];
    if (b) boxes.push(JSON.parse(JSON.stringify(b)));
  });
  if (!boxes.length) return;
  e.preventDefault();
  const text = s.toString(), json = JSON.stringify(boxes);
  COPIED = { text: text.trim(), boxes };
  e.clipboardData.setData("text/plain", text);
  e.clipboardData.setData(BOX_TYPE, json);
  e.clipboardData.setData("text/html", `<span data-pshita-boxes="${esc(json)}">${esc(text)}</span>`);
});
function copiedBoxes(cd) {
  try {
    const own = cd.getData(BOX_TYPE);
    if (own) return JSON.parse(own);
    const m = /data-pshita-boxes="([^"]*)"/.exec(cd.getData("text/html") || "");
    if (m) { tpl.innerHTML = `<i title="${m[1]}"></i>`; return JSON.parse(tpl.content.firstChild.title); }
  } catch (e) {}
  if (COPIED && (cd.getData("text/plain") || "").trim() === COPIED.text) return COPIED.boxes;
  return null;
}
// The boxes go under the paragraph screen the caret is in (or the reading screen before it).
function pasteBoxes(el, boxes) {
  const key = el.dataset.h, L = DATA[key] && DATA[key].L, [kind, a] = el.dataset.p.split(".");
  if (!L) return;
  let si = kind === "st" ? L.screens.findIndex((x) => x.st === +a && x.type === "read") : Number.isInteger(+a) ? +a : -1;
  while (si > 0 && L.screens[si] && L.screens[si].type !== "read") si--;
  if (si < 0 || !L.screens[si] || L.screens[si].type !== "read") { say("אפשר להדביק תבנית רק בתוך הטקסט של שיעור."); return; }
  snapshot(key);
  L.screens[si].after = (L.screens[si].after || []).concat(JSON.parse(JSON.stringify(boxes)));
  commit(key, null);
}

page.addEventListener("paste", async (e) => {
  if (!EDIT) return;
  e.preventDefault();
  let s = getSelection();
  if (!s.rangeCount) return;
  const a = elOf(s.getRangeAt(0).startContainer), b = elOf(s.getRangeAt(0).endContainer);
  if (!a || !b) return;
  const boxes = copiedBoxes(e.clipboardData);
  if (boxes) { pasteBoxes(a, boxes); return; }
  const text0 = e.clipboardData.getData("text/plain") || "", html0 = e.clipboardData.getData("text/html");
  if (a !== b && !(await deleteAcross(s.getRangeAt(0), a, b))) return;
  s = getSelection();
  const el = s.rangeCount && elOf(s.getRangeAt(0).startContainer);
  if (!el) return;
  pasteInto(el, text0, html0);
});
function pasteInto(el, text, html) {
  if (el.dataset.p.split(".")[0] !== "tx") {
    document.execCommand("insertText", false, text.replace(/\s*\n\s*/g, " ").trim());
    return;
  }
  const blocks = html ? pastedBlocks(html)
    : text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((l) => ({ type: "p", html: escText(l) }));
  if (!blocks.length) return;
  if (blocks.length === 1 && blocks[0].type === "p") { document.execCommand("insertHTML", false, blocks[0].html); return; }
  // several paragraphs or a heading: split this paragraph at the caret and put them in between
  const r = getSelection().getRangeAt(0);
  r.deleteContents();
  // the space between the paragraph's words and the pasted text is kept
  const side = (from, to) => { const x = document.createRange(); x.selectNodeContents(el); if (from) x.setStart(...from); if (to) x.setEnd(...to); return x.toString(); };
  const at = [r.startContainer, r.startOffset];
  let before = partHtml(el, null, at), after = partHtml(el, at, null);
  if (before && /\s$/.test(side(null, at))) before += " ";
  if (after && /^\s/.test(side(at, null))) after = " " + after;
  runOp(el, "pasteBlocks", before, blocks, after);
}

const escText = (t) => t.replace(/\u00a0/g, " ").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
// Is this CSS color a red (pure red, Word's dark red, the kit's red...)?
const colorProbe = document.createElement("span");
function isReddish(c) {
  if (!c) return false;
  colorProbe.style.color = "";
  colorProbe.style.color = c;
  if (!colorProbe.style.color) return false;
  document.body.appendChild(colorProbe);
  const m = getComputedStyle(colorProbe).color.match(/\d+/g) || [];
  colorProbe.remove();
  const [r, g, b] = m.map(Number);
  return r >= 140 && g <= 120 && b <= 120 && r - Math.max(g, b) >= 70;
}
// One pasted piece of text, keeping only bold, italic and red.
function pastedInline(n) {
  if (n.nodeType === 3) return escText(n.data);
  if (n.nodeType !== 1 || /^(STYLE|SCRIPT|META|TITLE)$/.test(n.tagName)) return "";
  if (n.tagName === "BR") return " ";
  let inner = [...n.childNodes].map(pastedInline).join("");
  if (!inner.trim()) return inner;
  const st = n.style || {}, t = n.tagName;
  const bold = ((t === "B" || t === "STRONG") && !/^(normal|[1-5]00)$/.test(st.fontWeight || "")) || /^(bold|bolder|[6-9]00)$/.test(st.fontWeight || "");
  const ital = t === "I" || t === "EM" || st.fontStyle === "italic";
  if (isReddish(st.color || (n.getAttribute && n.getAttribute("color")))) inner = `${RED}${inner}</span>`;
  if (ital) inner = `<i>${inner}</i>`;
  if (bold) inner = `<b>${inner}</b>`;
  return inner;
}
// Pasted HTML -> [{type:"p", html} | {type:"h", name}]
function pastedBlocks(html) {
  const doc = new DOMParser().parseFromString(html, "text/html"), out = [];
  let cur = "";
  const flush = () => { const t = cur.replace(/\s+/g, " ").trim(); if (plain(t)) out.push({ type: "p", html: t }); cur = ""; };
  const BLOCK = /^(P|DIV|LI|UL|OL|BLOCKQUOTE|TABLE|TBODY|TR|TD|TH|SECTION|ARTICLE|HEADER|FOOTER|PRE|DL|DT|DD)$/;
  const hasBlock = (n) => n.querySelector && n.querySelector("p,div,li,h1,h2,h3,h4,h5,h6,br,table");
  const walk = (node) => node.childNodes.forEach((n) => {
    if (n.nodeType === 3) { cur += escText(n.data); return; }
    if (n.nodeType !== 1 || /^(STYLE|SCRIPT|META|TITLE|HEAD)$/.test(n.tagName)) return;
    const t = n.tagName;
    if (/^H[1-6]$/.test(t) || /MsoTitle|MsoHeading|MsoSubtitle/i.test(n.className || "") || n.getAttribute("role") === "heading") {
      flush();
      const name = n.textContent.replace(/\s+/g, " ").trim();
      if (name) out.push({ type: "h", name: escText(name) });
      return;
    }
    if (t === "BR") { flush(); return; }
    if (BLOCK.test(t)) { flush(); walk(n); flush(); return; }
    // an inline wrapper around whole paragraphs (Google Docs does this): look inside
    if (hasBlock(n)) { walk(n); return; }
    cur += pastedInline(n);
  });
  walk(doc.body);
  flush();
  return out;
}

// Double-click any text (admin only) to start editing right there.
async function startEditAt(target, x, y) {
  if (EDIT) return;
  if (!isAdmin) {
    if (USER && USER.email === ADMIN_EMAIL) say("העריכה עוד נטענת. נסו שוב בעוד רגע.");
    return;
  }
  const point = { x, y }, el = target.closest && target.closest("[data-p]");
  const top = el && el.getBoundingClientRect().top;
  EDIT = true;
  await render(el ? { h: el.dataset.h, p: el.dataset.p, point, top } : { point });
}
page.addEventListener("dblclick", (e) => startEditAt(e.target, e.clientX, e.clientY));
// Phones and tablets often don't send a double-click: catch two quick taps ourselves.
let LAST_TAP = null;
page.addEventListener("touchend", (e) => {
  if (EDIT || e.touches.length || e.changedTouches.length !== 1 || PINCH) { LAST_TAP = null; return; }
  const t = e.changedTouches[0], now = Date.now();
  if (LAST_TAP && now - LAST_TAP.time < 400 && Math.hypot(t.clientX - LAST_TAP.x, t.clientY - LAST_TAP.y) < 30) {
    LAST_TAP = null;
    e.preventDefault();
    startEditAt(e.target, t.clientX, t.clientY);
  } else LAST_TAP = { time: now, x: t.clientX, y: t.clientY };
});

// ---------- admin ----------
async function startAdmin() {
  try {
    const [f, store] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js"),
      import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js"),
    ]);
    httpsCallable = f.httpsCallable;
    fns = f.getFunctions(auth.getApp());
    fs = store;
  } catch (err) {
    say("לא הצלחתי לטעון את העריכה. נסו לרענן את הדף.");
    return;
  }
  // one time: the students' records move to the lessons' new names (numbers); also on the admin page
  fs.getDoc(fs.doc(auth.getDb(), "settings", "migrations"))
    .then((snap) => { if (!(snap.exists() && snap.data().lessonIds2)) return httpsCallable(fns, "renameLessonIds")(); })
    .catch(() => {});
  // Editing lessons on the site doesn't depend on the drafts loading.
  try {
    await loadDrafts();
  } catch (err) {
    DRAFTS = [];
    DATA[NEW] = { L: newDraftData(), draft: true };
    say("תפריט העריכה לא נטען: " + ((err && (err.code || err.message)) || "שגיאה") + ". עריכת השיעורים עובדת כרגיל.");
  }
  await restoreBackups();
  await indexReady.catch(() => {});
  isAdmin = true;
  loadAll().then(() => { if (SELECTED.some((k) => DATA[k] && JSON.stringify(DATA[k].L.screens).includes("<!--shared:"))) render(); });
  SELECTED = (loadSelection() || defaultSelection()).filter((k) => !isDraft(k) || DATA[k]);
  drawMenus();
  render();
}

import("./assets/js/auth.js").then((m) => {
  auth = m;
  m.watchAuthState((user) => {
    USER = user;
    // this page is for the admin only: the admin signs in here (admin-login.js)
    if (!user || user.email !== ADMIN_EMAIL) { import("./assets/js/admin-login.js").then((x) => x.showAdminLogin()); return; }
    import("./assets/js/admin-login.js").then((x) => x.hideAdminLogin());
    if (!isAdmin) startAdmin();
  });
}).catch(() => { location.replace("./"); });

function say(t) { $("msg").textContent = t; }  // shown only when something went wrong

// ---------- the site's menu, the same as on every page (site-menu.js) ----------
import("./assets/js/site-menu.js?v=6").then(async (m) => {
  const box = await m.buildMenu();
  $("siteMenu").appendChild(box);
  box.addEventListener("menu-toggle", () => closePanels());
  moveViewIntoMenu();
  await m.activateMenu();
}).catch(() => {});

// In the site menu, "טקסט" opens a list with what "תצוגה" holds: the lessons and drafts to
// show, questions on / off, and adding, moving and publishing lessons. The menu's
// "טקסט" link (header-auth.js) is replaced once it's there.
function moveViewIntoMenu() {
  const swap = () => {
    const a = document.querySelector("#siteMenu a#admin-text-link");
    if (!a) return false;
    const sub = document.createElement("div");
    sub.className = "submenu";
    sub.id = "admin-text-link";
    sub.innerHTML = `<button type="button" class="dropdown-item submenu-trigger"><span>טקסט</span><svg class="submenu-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="dropdown-menu submenu-panel" hidden></div>`;
    const panel = sub.querySelector(".submenu-panel");
    const view = $("panels");
    panel.appendChild(view);
    view.hidden = false;
    sub.firstChild.addEventListener("click", (e) => {
      e.stopPropagation();
      const open = panel.hidden;
      sub.closest(".brand-menu").querySelectorAll(".submenu-panel").forEach((p) => { p.hidden = true; });
      panel.hidden = !open;
    });
    a.replaceWith(sub);
    return true;
  };
  if (swap()) return;
  const mo = new MutationObserver(() => { if (swap()) mo.disconnect(); });
  mo.observe($("siteMenu"), { childList: true, subtree: true });
}

// ---------- adding, moving and deleting lessons on the site (admin, in "תצוגה") ----------
// The server changes lessons.json, the menus and the home page (createLesson,
// moveLesson, deleteLesson in functions/index.js).
const idOfKey = (key) => key.replace(/^lessons\/|\.html$/g, "");
function lessonAction(t) {
  const row = t.closest(".lrow"), nl = t.closest(".newl"), b = t.closest("button");
  if (row && b && b.dataset.mv) { moveSiteLesson(row, b.dataset.mv); return true; }
  if (row && b && b.hasAttribute("data-del")) { deleteSiteLesson(row); return true; }
  if (!nl) return false;
  const form = nl.querySelector(".nl-form");
  if (b && b.classList.contains("nl-toggle")) form.hidden = !form.hidden;
  else if (b && b.classList.contains("nl-cancel")) form.hidden = true;
  else if (b && b.classList.contains("nl-create")) createSiteLesson(nl);
  return true;
}
function sortSelected() {
  const order = menus().flatMap((g) => g.items.map((it) => it.key));
  SELECTED.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  saveSelection();
}
async function moveSiteLesson(row, direction) {
  const key = row.dataset.key;
  row.classList.add("busy");
  try {
    await httpsCallable(fns, "moveLesson")({ lessonId: idOfKey(key), direction });
    const g = GROUPS.find((x) => x.lessons.some((l) => l.key === key)), i = g.lessons.findIndex((l) => l.key === key), j = direction === "up" ? i - 1 : i + 1;
    [g.lessons[i], g.lessons[j]] = [g.lessons[j], g.lessons[i]];
    sortSelected();
    drawMenus();
    render();
  } catch (err) {
    row.classList.remove("busy");
    say((err && err.message) || "שינוי הסדר נכשל.");
  }
}
async function deleteSiteLesson(row) {
  const key = row.dataset.key, l = GROUPS.flatMap((g) => g.lessons).find((x) => x.key === key);
  if (!confirm('למחוק את השיעור "' + plain(l ? l.title : idOfKey(key)) + '"? הפעולה לא הפיכה.')) return;
  row.classList.add("busy");
  try {
    await httpsCallable(fns, "deleteLesson")({ lessonId: idOfKey(key) });
    GROUPS.forEach((g) => { g.lessons = g.lessons.filter((x) => x.key !== key); });
    SELECTED = SELECTED.filter((k) => k !== key);
    delete DATA[key];
    saveSelection();
    drawMenus();
    render();
  } catch (err) {
    row.classList.remove("busy");
    say((err && err.message) || "המחיקה נכשלה.");
  }
}
async function publishDraft(key, btn) {
  const { daf, amud } = parseRef(DATA[key] && DATA[key].L.ref);
  if (!daf || !amud) { say("צריך לבחור דף ועמוד בכותרת לפני ההעלאה."); return; }
  const group = `דף ${daf}, עמוד ${amud}`;
  btn.disabled = true;
  btn.textContent = "מעלה…";
  try {
    // what was typed last goes up too
    if (DIRTY.has(key)) await saveNow(key);
    if (DIRTY.has(key)) throw new Error(SAVE_FAILED.has(key) ? "השמירה לא הצליחה" : "יש שינויים שעוד לא נשמרו");
    // the lesson's name on the site: daf-amud-number, given by the server
    const res = await httpsCallable(fns, "publishDraft")({ id: key.slice(6), group });
    const newKey = `lessons/${res.data.lessonId}.html`;
    DATA[newKey] = { L: JSON.parse(res.data.src), base: res.data.src };
    delete DATA[key];
    DRAFTS = DRAFTS.filter((d) => "draft:" + d.id !== key);
    dropBackup(key);
    let g = GROUPS.find((x) => x.name === group);
    if (!g) { g = { name: group, lessons: [] }; GROUPS.push(g); }
    g.lessons.push({ key: newKey, title: res.data.title });
    SELECTED = SELECTED.map((k) => (k === key ? newKey : k));
    sortSelected();
    drawMenus();
    render();
  } catch (err) {
    btn.disabled = false;
    btn.classList.remove("sure");
    btn.textContent = "העלאה";
    say((err && err.message) || "ההעלאה לא הצליחה.");
  }
}
async function createSiteLesson(nl) {
  const status = nl.querySelector(".nl-status"), title = nl.querySelector(".nl-title").value.trim();
  if (!title) { status.textContent = "צריך כותרת."; return; }
  const g = GROUPS.find((x) => x.name === nl.dataset.group), last = g && g.lessons[g.lessons.length - 1];
  status.textContent = "יוצר…";
  try {
    // the lesson's name: daf-amud-number, given by the server
    const id = (await httpsCallable(fns, "createLesson")({ titleText: title, sourceText: nl.dataset.group, afterLessonId: last ? idOfKey(last.key) : null })).data.lessonId;
    // the new lesson, straight from the repository (the site takes a minute or two to show it)
    const key = `lessons/${id}.html`, src = (await httpsCallable(fns, "getLessonData")({ path: key })).data.src;
    DATA[key] = { L: JSON.parse(src), base: src };
    g.lessons.push({ key, title: DATA[key].L.title });
    SELECTED.push(key);
    sortSelected();
    drawMenus();
    render();
  } catch (err) {
    status.textContent = (err && err.message) || "יצירת השיעור נכשלה.";
  }
}

// First visit: the first lesson; after that, whatever was open last time.
function defaultSelection() {
  const first = GROUPS[0] && GROUPS[0].lessons[0];
  return first ? [first.key] : [];
}
const indexReady = loadIndex();
indexReady.catch(() => { $("page").innerHTML = '<p class="empty">לא הצלחתי לטעון את רשימת השיעורים.</p>'; });
</script>
