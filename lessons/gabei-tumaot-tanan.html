<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>גבי טומאות תנן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap">
<style>
/* layout: phone-width question player (kit "לילה וזהב"), preview bar above with lesson-text toggle and approval list */
:root{
  --cream:#FFF8EC; --sand:#F5EBD3; --line:#E8DCC4; --paper:#FFFFFF;
  --navy:#14213D; --navy2:#22335A; --soft:#AEB9D6;
  --gold:#F2B33D; --gold-d:#B9801A; --amber-l:#FCEBC4; --amber-d:#8A6A1F;
  --teal:#2BB3A3; --teal-l:#E6F6F3; --teal-d:#1A7D72;
  --red:#B5432A; --red-l:#FBE3D9; --muted:#5A6680; --tan:#D8C39A;
  --ui:Rubik,'Segoe UI',Arial,sans-serif; --text:'Frank Ruhl Libre',Georgia,serif;
}
*{box-sizing:border-box}
body{background:var(--sand);color:var(--navy);font-family:var(--ui);direction:rtl}
.wrap{max-width:460px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
button{font-family:var(--ui);cursor:pointer;color:var(--navy)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tool{background:var(--navy);color:var(--cream);border-radius:16px;padding:12px;display:grid;gap:8px}
.tool h1{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tool h1 small{color:var(--soft);font-weight:400;font-size:12px}
.row2{display:flex;gap:6px}
.row2 button{flex:1;border:1px solid var(--navy2);background:transparent;color:var(--cream);border-radius:10px;padding:8px;font-size:13px;font-weight:500}
.row2 button.on{border-color:var(--gold);color:var(--gold)}
.screen{background:var(--cream);border-radius:22px;border:1px solid var(--line);min-height:620px;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:14px 14px 6px}
.back{border:0;background:var(--sand);width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
.prog{flex:1;display:flex;gap:2px}.prog i{flex:1;height:7px;border-radius:4px;background:var(--line)}.prog i.f{background:var(--gold)}
.tabs{display:flex;gap:6px;padding:4px 14px;justify-content:center}
.tabs b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.tabs b.d{background:var(--tan);border-color:var(--tan);color:var(--navy)}.tabs b.c{background:var(--gold);border-color:var(--gold-d);color:var(--navy)}
.chiprow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px 0}
.chip{background:var(--navy);color:var(--cream);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.kind{font-size:12px;color:var(--amber-d);font-weight:700;background:var(--amber-l);border-radius:99px;padding:4px 10px}
.body{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
.foot{padding:12px 14px 16px}
.go{width:100%;border:0;background:var(--gold);color:var(--navy);font-weight:800;font-size:17px;padding:14px;border-radius:14px;box-shadow:0 5px 0 var(--gold-d)}
.go:disabled{background:var(--line);color:var(--muted);box-shadow:0 5px 0 var(--tan);cursor:default}
.q{font-size:19px;font-weight:700;line-height:1.5;margin:4px 0 0;text-wrap:balance}
.tx{font-family:var(--text);font-weight:700;line-height:1.75;font-size:18px}
.tx b{color:var(--red)}
.ptext{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{text-align:right;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:500;display:flex;gap:10px;align-items:center}
.opt i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-weight:700;flex:none;font-size:13px}
.ok{border-color:var(--teal)!important;background:var(--teal-l)!important;color:var(--teal-d)!important;font-weight:700}
.no{border-color:var(--red)!important;background:var(--red-l)!important;color:var(--red)!important}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tfrow .opt{justify-content:center;font-weight:700;font-size:17px}
.stmt{background:var(--paper);border:2px solid var(--navy);border-radius:14px;padding:16px;font-size:18px;font-weight:700;line-height:1.5;text-align:center}
.sent{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:18px;line-height:2;font-weight:500}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--gold);text-align:center;font-weight:800;padding:0 6px}
.why{background:var(--navy);color:var(--cream);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.5}
.why b{color:var(--gold);display:block;font-size:13px}
.why.bad b{color:#F2A08A}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-size:16px;font-weight:700}
.tile[disabled]{opacity:.3}
.line{min-height:56px;background:var(--amber-l);border:2px dashed var(--gold-d);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.line.ok,.line.no{border-style:solid}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:grid;gap:8px;align-content:start}
.mitem{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px;font-size:15px;font-weight:600;text-align:center;min-height:52px}
.mitem.sel{border-color:var(--gold);background:var(--amber-l)}
.sortitem{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.sortitem>span{font-weight:700;font-size:16px}
.sortitem .bk{display:flex;gap:6px}
.sortitem .bk button{flex:1;border:2px solid var(--line);background:var(--sand);border-radius:10px;padding:7px;font-weight:700;font-size:14px}
.words{display:flex;flex-wrap:wrap;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;font-family:var(--text);font-size:22px;font-weight:700;justify-content:center}
.words button{border:0;background:transparent;font-family:var(--text);font-size:22px;font-weight:700;padding:2px 6px;border-radius:6px;border-bottom:2px dotted var(--tan)}
.words button.ok,.words button.no{border-width:0}
.flips{display:grid;gap:10px}
.card{border:2px solid var(--navy);background:var(--navy);color:var(--cream);border-radius:14px;padding:16px;text-align:center;min-height:110px;display:grid;place-items:center;gap:4px;width:100%}
.card big{font-family:var(--text);font-size:30px;color:var(--gold)}
.card.open{background:var(--paper);color:var(--navy)}
.card.open strong{color:var(--teal-d);font-size:18px}
.card small{font-size:13px;opacity:.85}
.sides{display:grid;gap:8px}
.side{background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px}
.side:nth-child(2){border-radius:14px 14px 4px 14px;background:var(--amber-l)}
.side b{display:block;font-size:13px;color:var(--amber-d)}
.open-a{border:2px dashed var(--teal);background:var(--teal-l);border-radius:14px;padding:12px;color:var(--teal-d);font-weight:700}
.ghost{border:2px solid var(--navy);background:transparent;border-radius:12px;padding:10px;font-weight:700}
.score{text-align:center}.score h2{margin:0;font-family:var(--text);font-weight:900;font-size:30px}.score p{margin:4px 0 0;color:var(--muted)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--paper)}
th{background:var(--navy);color:var(--gold);padding:8px;text-align:right}
td{padding:8px;border-top:1px solid var(--line);vertical-align:top;line-height:1.4}
.links{display:flex;gap:8px}.links a{flex:1;text-align:center;border:2px solid var(--navy);border-radius:12px;padding:10px;color:var(--navy);font-weight:700;text-decoration:none;font-size:14px}
.list{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:14px}
.list h3{margin:0;font-size:15px;background:var(--navy);color:var(--gold);border-radius:8px;padding:6px 10px}
.li{display:grid;gap:4px;font-size:14px;line-height:1.5;border-bottom:1px solid var(--line);padding-bottom:10px}
.li .h{display:flex;gap:6px;align-items:center;font-weight:700}
.li .h span{font-size:11px;background:var(--amber-l);color:var(--amber-d);border-radius:99px;padding:2px 8px}
.li .c{color:var(--teal-d);font-weight:700}
.li .w{color:var(--muted)}
.flag{display:flex;align-items:center;gap:10px}
.flag .n{width:38px;height:38px;border-radius:50%;background:var(--gold);box-shadow:0 3px 0 var(--gold-d);display:grid;place-items:center;font-weight:800;font-size:18px}
.flag h2{margin:0;font-size:20px;font-weight:800;text-wrap:balance}
mark{background:var(--amber-l);color:inherit;padding:0 3px;border-radius:4px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp>div{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.cmp>div.red{border-color:var(--red)}.cmp>div.teal{border-color:var(--teal)}
.cmp strong{display:block;font-size:16px;font-weight:800;margin-bottom:4px}
.cmp .red strong{color:var(--red)}.cmp .teal strong{color:var(--teal-d)}
.cmp span{font-size:14px;color:var(--muted);line-height:1.45}
.short{background:var(--navy);color:var(--cream);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.55}
.short b{color:var(--gold);display:block;font-size:13px;margin-bottom:3px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills span{background:var(--navy);color:var(--cream);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px}
.verse{background:var(--paper);border-right:6px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.verse.red{border-color:var(--red)}.verse.teal{border-color:var(--teal)}
.verse .v{font-family:var(--text);font-weight:700;font-size:19px;line-height:1.6}
.verse.red .w{background:var(--red-l);color:var(--red);padding:0 4px;border-radius:4px}
.verse.teal .w{background:var(--teal-l);color:var(--teal-d);padding:0 4px;border-radius:4px}
.verse small{color:var(--muted);font-size:12px}
.srcq{border:2px solid var(--gold);background:var(--amber-l);border-radius:14px;padding:14px;font-family:var(--text);font-weight:700;font-size:20px;line-height:1.6;text-align:center}
.daf{text-align:center;display:grid;gap:4px;padding-top:8px}
.daf h1{margin:0;font-family:var(--text);font-weight:900;font-size:34px}
.daf p{margin:0;color:var(--muted);font-size:14px}
.daf hr{width:60%;border:0;border-top:2px solid var(--gold);margin:8px auto 0}
.ph{aspect-ratio:16/9;border:2px dashed var(--tan);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:8px;max-width:100%}
.fbs{font-weight:700;font-size:15px}.fbs.ok{color:var(--teal-d);background:none!important;border:0!important}.fbs.no{color:var(--red);background:none!important;border:0!important}
.foot{display:grid;gap:10px}
.ipill{display:inline-block;background:var(--navy);color:var(--cream);border-radius:99px;padding:0 12px;font-family:var(--ui);font-weight:700;font-size:.85em;line-height:1.7}
.bars{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.bar{display:grid;grid-template-columns:4.5em minmax(0,1fr) auto;gap:8px;align-items:center;font-weight:700;font-size:14px}
.bt{height:14px;background:var(--sand);border-radius:7px;overflow:hidden}.bt i{display:block;height:100%;border-radius:7px}
.bt i.teal{background:var(--teal)}.bt i.gold{background:var(--gold)}.bv{color:var(--muted);font-size:13px;white-space:nowrap}

/* ===== tablet & desktop ===== */
.rcols,.rmain,.raside{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:700px){
 .wrap{max-width:none;padding-block:20px 32px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
 .screen{min-height:calc(100vh - 52px);border-radius:28px}
 .top{padding:16px 28px 6px}
 .qhead{padding:4px 28px 0;font-size:26px}

 .foot{padding:14px 28px 24px}
 .foot:not(.two){justify-items:end}.foot:not(.two) .go{max-width:440px}
 .foot.two{max-width:620px;margin-inline-start:auto;margin-inline-end:0;width:100%;box-sizing:border-box}
 .tx{font-size:21px}
 .q{font-size:23px}
 .flag h2{font-size:24px}.flag .n{width:44px;height:44px;font-size:20px}
 .ptext{padding:18px 22px}
 .cmp strong{font-size:18px}.cmp span{font-size:15px}
 .short{font-size:17px;padding:14px 18px}
 .opt{font-size:18px;padding:14px 18px}
 .screen.intro{flex-direction:row}

 table{font-size:16px}
}
@media (min-width:1080px){
 .wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
 .top,.body,.foot,.qhead{padding-inline:40px}
 .rcols.has-side{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:22px;align-items:start}
 .rcols.has-side .raside{position:sticky;top:16px}
 .raside .cmp{grid-template-columns:1fr}
 .body:has(.opts),.body:has(.stmt),.body:has(.sortitem),.body:has(.mgrid){max-width:960px;margin-inline:auto;width:100%;box-sizing:border-box}

}
@media (prefers-reduced-motion:no-preference){.bt i{animation:grow .8s ease-out}@keyframes grow{from{width:0}}}
.comic{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.cph{aspect-ratio:4/3;max-width:100%;border:2px dashed var(--tan);margin:6px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center;padding:4px}
.cart{display:block;width:100%;height:auto;aspect-ratio:4/3;border-bottom:2px solid var(--navy)}
.cap.tx{padding:8px 9px 10px;font-size:15px;line-height:1.55}

.iband .ititle{margin-top:6px}
.iband .iq{margin-bottom:0}
.iline{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--soft);font-weight:500}
.ititle{font-family:var(--text);font-size:34px;font-weight:900;line-height:1.2;text-wrap:balance}
.iq{font-size:15px;color:#C9D1E6;line-height:1.5}
.ibody{padding:18px;display:flex;flex-direction:column;gap:14px;flex:1}

.icard{background:var(--paper);border:3px solid;border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.icard .it{font-size:20px;font-weight:800}
.icard .is{font-size:13px;line-height:1.4}
.icard .iw{color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px}
.ibody .go{margin-top:auto}
.prog .seg{flex:1;border:0;background:transparent;padding:8px 0;cursor:pointer;display:block;min-width:0}
.prog .seg i{display:block;height:7px;border-radius:4px;background:var(--line)}
.prog .seg.f i{background:var(--gold)}
.prog .seg:not(:disabled):hover i{background:var(--gold-d)}
.prog .seg:disabled{cursor:default}
.prog{gap:3px}
.top{padding-top:10px}
.qhead{padding:4px 14px 0;font-family:var(--text);font-weight:900;font-size:22px;color:var(--amber-d);text-wrap:balance}
.foot.two{display:flex;gap:10px;align-items:stretch}
.foot.two>button{flex:1;min-width:0}
.skip{border:2px solid var(--navy);background:var(--paper);color:var(--navy);font-weight:700;font-size:16px;padding:12px;border-radius:14px;box-shadow:0 5px 0 var(--line)}
.qcount{padding:6px 14px 0;font-size:13px;font-weight:700;color:var(--muted)}
.gdone{text-align:center;font-family:var(--text);font-weight:900;font-size:26px;color:var(--teal-d)}
.qgate{display:grid;gap:6px;text-align:center}.qgate p{margin:0;font-weight:700;font-size:14px;color:var(--amber-d)}

body{margin:0}@media (min-width:700px){.screen .qhead{padding:6px 28px 0;font-size:26px}.screen .chiprow{padding:8px 28px 0}.screen .qcount{padding:6px 28px 0}}

.kicker{font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--amber-d)}

  return `<div class="q">${s.q}</div><div class="line ${r.done?(r.ok?'ok':'no'):''}">${r.seq.map((i,n)=>`<button class="tile" data-rm="${n}" ${r.done?'disabled':''}>${pool[i]}</button>`).join('')||'<span class="lbl">לחצו על החלקים לפי הסדר</span>'}</div>
  <div class="tiles">${order.map(i=>`<button class="tile" data-add="${i}" ${r.seq.includes(i)||r.done?'disabled':''}>${pool[i]}</button>`).join('')}</div>
  ${r.done&&!r.ok?`<div class="lbl">התשובה: ${s.type==='build'?s.ans:s.items.join(' · ')}</div>`:''}${r.done?whyBox(s,r):''}`}
 if(s.type==='match'){const right=shuf(s.pairs.map((_,i)=>i),k+7);
  return `<div class="q">${s.q}</div><div class="lbl">לחצו על מילה ואחר כך על מה שמתאים לה</div><div class="mgrid"><div class="mcol">${s.pairs.map((p,i)=>`<button class="mitem ${r.matched[i]?'ok':''} ${r.sel===i?'sel':''}" data-l="${i}" ${r.matched[i]?'disabled':''}>${p[0]}</button>`).join('')}</div><div class="mcol">${right.map(i=>`<button class="mitem ${r.matched[i]?'ok':''} ${r.flash===i?'no':''}" data-r="${i}" ${r.matched[i]?'disabled':''}>${s.pairs[i][1]}</button>`).join('')}</div></div>${r.done?whyBox(s,r):''}`}
 if(s.type==='sort'){const order=shuf(s.items.map((_,i)=>i),k+5);
  return `<div class="q">${s.q}</div>${order.map(i=>{const it=s.items[i],v=r.sorted[i];return `<div class="sortitem"><span>${it[0]}</span><div class="bk">${s.baskets.map((b,bi)=>`<button data-it="${i}" data-b="${bi}" class="${v!==undefined?(bi===it[1]?(v===bi||r.done?'ok':''):(v===bi?'no':'')):''}" ${v!==undefined&&v===it[1]?'disabled':''}>${b}</button>`).join('')}</div></div>`}).join('')}${r.done?whyBox(s,r):''}`}
 if(s.type==='flip')return `<div class="q">הפכו את הקלפים</div><div class="flips">${s.cards.map((c,i)=>r.open[i]?`<button class="card open" data-f="${i}"><small>${c[1]}</small><strong>${c[2]}</strong><small>${c[3]}</small></button>`:`<button class="card" data-f="${i}"><big>${c[0]}</big><small>${c[1]}</small></button>`).join('')}</div>`;
 if(s.type==='open')return `<div class="q">${s.q}</div><div class="lbl">חשבו לבד, ואחר כך פתחו תשובה לדוגמה</div>${r.done?`<div class="open-a">${s.ans}</div>`:`<button class="ghost" id="reveal">הצג תשובה לדוגמה</button>`}`;
 if(s.type==='summary'){const sc=screens().filter(x=>SCORED.includes(x.type)&&st(x).done);const good=sc.filter(x=>st(x).ok===true).length;
  return `<div class="score"><h2>כל הכבוד!</h2>${sc.length?`<p>ענית נכון בפעם הראשונה על ${good} מתוך ${sc.length} שאלות</p>`:'<p>סיימת לעבור על השיעור</p>'}</div>
  <div class="tbl"><table><tr>${s.table.cols.map(c=>`<th>${c}</th>`).join('')}</tr>${s.table.rows.map(rw=>`<tr>${rw.map((c,i)=>`<td>${i?c:'<b>'+c+'</b>'}</td>`).join('')}</tr>`).join('')}</table></div>
  <div class="links"><a href="${LESSON.prev}">לשיעור הקודם</a>${LESSON.next?`<a href="${LESSON.next}">לשיעור הבא</a>`:''}</div>`}
}
function isDone(s){const r=st(s);return s.type==='read'||s.type==='intro'||s.type==='summary'||r.done}
function wire(s){const r=st(s),q=sel=>view.querySelectorAll(sel);
 const answer=v=>{if(r.done)return;r.pick=v;r.ok=(v===s.a);r.done=true;draw()};
 q('[data-a]').forEach(b=>b.onclick=()=>{const v=b.dataset.a;answer(s.type==='tf'?v==='true':+v)});
 q('[data-add]').forEach(b=>b.onclick=()=>{r.seq.push(+b.dataset.add);const pool=s.type==='build'?s.tiles:s.items;
  if(r.seq.length===pool.length){const got=r.seq.map(i=>pool[i]).join(' ');r.ok=s.type==='build'?got===s.ans:r.seq.every((v,i)=>v===i);r.done=true}draw()});
 q('[data-rm]').forEach(b=>b.onclick=()=>{r.seq.splice(+b.dataset.rm,1);draw()});
 q('[data-l]').forEach(b=>b.onclick=()=>{r.sel=+b.dataset.l;r.flash=null;draw()});
 q('[data-r]').forEach(b=>b.onclick=()=>{if(r.sel===null)return;const i=+b.dataset.r;if(i===r.sel){r.matched[i]=1;r.sel=null;r.flash=null}else{r.miss++;r.flash=i}
  if(Object.keys(r.matched).length===s.pairs.length){r.done=true;r.ok=r.miss===0}draw()});
 q('[data-it]').forEach(b=>b.onclick=()=>{const i=+b.dataset.it,bi=+b.dataset.b;if(r.sorted[i]===s.items[i][1])return;r.sorted[i]=bi;if(bi!==s.items[i][1])r.miss++;
  if(s.items.every((it,j)=>r.sorted[j]===it[1])){r.done=true;r.ok=r.miss===0}draw()});
 q('[data-f]').forEach(b=>b.onclick=()=>{const i=+b.dataset.f;r.open[i]=!r.open[i];if(s.cards.every((_,j)=>r.open[j]))r.done=true;draw()});
 const rv=document.getElementById('reveal');if(rv)rv.onclick=()=>{r.done=true;draw()};
}
const ICONS={
 book:c=>`<svg width="54" height="54" viewBox="0 0 54 54" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M27 15c-5-4-13-4-19-2v28c6-2 14-2 19 2 5-4 13-4 19-2V13c-6-2-14-2-19 2z"/><path d="M27 15v28"/></svg>`,
 branch:c=>`<svg width="54" height="54" viewBox="0 0 54 54" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="27" cy="11" r="6"/><path d="M27 17v9M27 26l-13 9M27 26l13 9M27 26v9"/><circle cx="13" cy="41" r="5"/><circle cx="27" cy="41" r="5"/><circle cx="41" cy="41" r="5"/></svg>`,
 scroll:c=>`<svg width="54" height="54" viewBox="0 0 54 54" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10h22a6 6 0 0 1 6 6v28H20a6 6 0 0 1-6-6V14"/><path d="M10 14a4 4 0 0 1 8 0v24"/><path d="M25 20h12M25 27h12M25 34h8"/></svg>`,
 spark:c=>`<svg width="54" height="54" viewBox="0 0 54 54" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="27" cy="27" r="8"/><path d="M27 6v7M27 41v7M6 27h7M41 27h7M12 12l5 5M37 37l5 5M42 12l-5 5M17 37l-5 5"/></svg>`,
 tooth:c=>`<svg width="54" height="54" viewBox="0 0 54 54" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 13c4-4 10-3 14 0 4-3 10-4 14 0 5 5 2 14-1 20-2 5-2 12-6 12-3 0-3-10-7-10s-4 10-7 10c-4 0-4-7-6-12-3-6-6-15-1-20z"/></svg>`,
 horn:c=>`<svg width="54" height="54" viewBox="0 0 54 54" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 46C12 28 24 12 44 8C34 18 28 30 26 46Z"/><path d="M15 38h12M19 28h11M25 19h10"/></svg>`,
 run:c=>`<svg width="54" height="54" viewBox="0 0 54 54" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M30 18c4-7 12-9 16-6-5 0-8 3-9 7"/><path d="M14 30c0-7 6-12 14-12h6l6 6-3 6h-6l-4 10H17l-3-10z"/><path d="M4 22h7M2 30h8M4 38h7"/></svg>`,
 push:c=>`<svg width="54" height="54" viewBox="0 0 54 54" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="30" y="14" width="16" height="26" rx="3"/><path d="M6 27h18M18 20l7 7-7 7"/></svg>`};
function introScreen(s){
 return `<div class="screen intro">
 <div class="iband"><div class="iline"><div>${s.daf}</div><div>${s.series}</div></div><div class="ititle">${LESSON.title}</div><div class="iq">${s.question}</div></div>
 <div class="ibody">
  <div class="icards">${s.cards.map(c=>`<div class="icard" style="border-color:${c.c}">${ICONS[c.icon](c.c)}<div class="it" style="color:${c.c}">${c.t}</div><div class="is">${c.s}</div><div class="iw" style="background:${c.c}">${c.w}</div></div>`).join('')}</div>
  <button class="go" id="go">יוצאים לדרך</button>
 </div></div>`}
function drawPlay(){const list=screens();if(cur>=list.length)cur=list.length-1;const s=list[cur];
 if(s.type==='intro'){view.innerHTML=introScreen(s);document.getElementById('go').onclick=()=>{cur++;draw();window.scrollTo(0,0)};return}
 const tabs=LESSON.stations.map((n,i)=>`<b class="${i===s.st&&s.type!=='summary'?'c':(s.type==='summary'||i<s.st?'d':'')}" title="${n}">${i+1}</b>`).join('');
 const label=(s.type==='summary'||s.type==='intro'||s.type==='gate')?'':s.type==='read'?'':`<div class="chiprow"><span class="chip">${s.final?'סיכום':LESSON.stations[s.st]}</span><span class="kind">${KIND[s.type]}</span></div>`+(grp(s)?`<div class="qcount">שאלה ${grp(s).i+1} מתוך ${grp(s).n}</div>`:'');
 const isQ=!NONQ.includes(s.type);
 const segs=list.map((x,i)=>['intro','read','summary'].includes(x.type)?`<button class="seg ${i<=cur?'f':''}" data-goto="${i}" ${i<=cur?'':'disabled'} aria-label="${x.type==='intro'?'פתיחה':x.type==='summary'?'סיכום':LESSON.stations[x.st]}"><i></i></button>`:'').join('');
 view.innerHTML=`<div class="screen"><div class="top"><div class="prog">${segs}</div></div>
 ${isQ?`<div class="qhead">${GATE_TITLE}</div>`:''}${label}<div class="body">${body(s)}${(()=>{const g=grp(s);return g&&g.i===g.n-1&&isDone(s)?'<div class="gdone">כל הכבוד!</div>':''})()}</div>
 <div class="foot ${isQ?'two':''}">${isQ?`<button class="skip" id="skipq">דלג על התרגול</button>`:''}<button class="go" id="go">${s.type==='summary'?'מתחילים מחדש':s.type==='intro'?'יוצאים לדרך':'המשך'}</button></div></div>`;
 view.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{cur=+b.dataset.goto;draw();window.scrollTo(0,0)});
 const sk=document.getElementById('skipq');if(sk)sk.onclick=()=>{let i=cur+1;while(i<list.length&&!NONQ.includes(list[i].type))i++;cur=Math.min(i,list.length-1);draw();window.scrollTo(0,0)};
 document.getElementById('go').onclick=()=>{if(s.type==='summary'){cur=0;R={}}else cur++;draw();window.scrollTo(0,0)};
 wire(s)}
function drawList(){let h='',last=-1,n=0;
 LESSON.screens.forEach(s=>{if(s.type==='read'||s.type==='summary')return;n++;
  if(s.st!==last&&!s.final){h+=`<h3>${s.st+1}. ${LESSON.stations[s.st]}</h3>`;last=s.st}
  if(s.final)h+=`<h3>סיכום</h3>`;
  let q='',c='';
  if(s.type==='mc'||s.type==='fill'||s.type==='judge'){q=s.type==='fill'?`${s.before}___${s.after}`:s.type==='judge'?s.sides.map(x=>x[0]+': '+x[1]).join(' / '):s.q;c=s.o.map((o,i)=>i===s.a?`<span class="c">${AB[i]}. ${o} ✓</span>`:`${AB[i]}. ${o}`).join(' · ')}
  else if(s.type==='tf'){q=s.s;c=`<span class="c">${s.a?'נכון':'לא נכון'}</span>`}
  else if(s.type==='marker'){q=s.q+': '+s.words.join(' ');c=`<span class="c">${s.words[s.a]}</span>`}
  else if(s.type==='build'){q=s.q;c=`<span class="c">${s.ans}</span>`}
  else if(s.type==='order'){q=s.q;c=`<span class="c">${s.items.join(' ← ')}</span>`}
  else if(s.type==='match'){q=s.q;c=s.pairs.map(p=>`<span class="c">${p[0]} = ${p[1]}</span>`).join(' · ')}
  else if(s.type==='sort'){q=s.q;c=s.baskets.map((b,bi)=>`<b>${b}:</b> <span class="c">${s.items.filter(it=>it[1]===bi).map(it=>it[0]).join(', ')}</span>`).join(' · ')}
  else if(s.type==='flip'){q='קלפים';c=s.cards.map(x=>`${x[1]} <span class="c">${x[2]}</span>`).join(' · ')}
  else if(s.type==='open'){q=s.q;c=`<span class="c">${s.ans}</span>`}
  h+=`<div class="li"><div class="h">${n}. <span>${KIND[s.type]}</span></div><div>${q}</div><div>${c}</div>${s.why||s.din?`<div class="w">${s.why||s.din}</div>`:''}</div>`});
 view.innerHTML=`<div class="list">${h}</div>`}
function draw(){drawPlay()}
draw();
</script>
